# Part cooling fan is now on the INDX head -> [fan] is in config/INDX_toolhead.cfg
[fan]
###	Print Cooling Fan - CNC_FAN4: CPAP (active part cooling)
# The INDX head [fan] in config/INDX_toolhead.cfg is commented out.
pin: PA4
max_power: 0.6
shutdown_speed: 0
cycle_time: 0.005
hardware_pwm: False
kick_start_time: 0.100
min_power: 0.10

[controller_fan controller_fan]
##	Controller fan - CNC_FAN5
pin: PA6
tachometer_pin: PC2
max_power: 1
kick_start_time: 0.5
fan_speed: 1
idle_timeout: 30
heater: extruder, heater_bed
stepper: stepper_x, stepper_y, stepper_z

#[heater_fan fan6]
#pin: PA2
#tachometer_pin: PC1

#####################################################################
# 	LED Control
#####################################################################

[neopixel progressbar]
pin: PD15
chain_count: 50
color_order: GRB
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0

[led cool_white]
# Chamber Lighting - HE2 Connector (Optional)
white_pin: PA3
#cycle_time: 0.0100
#hardware_pwm: False
initial_WHITE: 0.0

[led warm_white]
# Chamber Lighting - HE3 Connector (Optional)
white_pin: PA5
#cycle_time: 0.0100
#hardware_pwm: False
initial_WHITE: 0.0

#####################################################################
# 	Homing and Gantry Adjustment Routines
#####################################################################

# No [safe_z_home]: homing is done by [homing_override] in indx/homing.cfg
# (Z is always homed with T0 on the INDX load cell).

[z_tilt]
##  Use Z_TILT_ADJUST to level the bed .
##  z_positions: Location of toolhead

z_positions:
    -64, -5
    177.5, 436
    419, -5
##  points = nozzle positions (the load cell measures directly at the nozzle, no offset).
##  The front points must be behind clearance_y from indx/indx.cfg,
##  so the head does not hit parked tools while probing.
##  Check after calibrating the docks and move further back if needed.
points:
    15, 30
    177.5, 320
    340, 30

speed: 200
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.0075
