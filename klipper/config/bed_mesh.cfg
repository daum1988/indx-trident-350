#####################################################################
#  Bed Mesh mit dem Eddy-Scanner im INDX Smart Head
#####################################################################
#  Ersetzt den [bed_mesh]-Teil der alten cartographer.cfg.
#  Der Scanner ist [probe_eddy_current scanner] in config/INDX_toolhead.cfg
#  (register_as_probe: False). Standard-Probe bleibt die Load-Cell,
#  deshalb muss jeder Mesh-Aufruf den Scanner ausdruecklich waehlen:
#
#      BED_MESH_CALIBRATE PROBE=scanner METHOD=rapid_scan
#
#  Ohne PROBE=scanner tippt die Load-Cell jeden Punkt einzeln an,
#  ohne METHOD=rapid_scan haelt der Scanner an jedem Punkt.
#
#  Vor der ersten Nutzung einmal kalibrieren (T0 auf dem Kopf, Duese kalt):
#      G28
#      LDC_CALIBRATE_DRIVE_CURRENT CHIP=scanner
#      SAVE_CONFIG
#      G28
#      PROBE_EDDY_CURRENT_CALIBRATE CHIP=scanner
#      SAVE_CONFIG
#
#  Mit kalter Duese scannen: die Induktionsheizung stoert den Scanner.
#####################################################################

[bed_mesh]
speed: 300
#   Scan-Geschwindigkeit. Meldet Kalico "Sample rate is not high enough",
#   hier senken oder beim Aufruf SCAN_SPEED= angeben.
horizontal_move_z: 2
#   Scan-Hoehe. Muss ueber dem z_offset des Scanners (1.0) liegen.
mesh_min: 15, 40
#   Koordinaten sind SCANNER-Positionen. Der Scanner sitzt 34.5 mm hinter
#   der Duese, die Duese ist also 34.5 mm weiter vorne. Y >= clearance_y + 35,
#   damit die Duese beim Scannen nicht in den Dock-Bereich faehrt.
mesh_max: 340, 340
probe_count: 20, 20
#   Ca. 17 mm Rasterabstand, passend zum Spulendurchmesser (~17.6 mm).
adaptive_margin: 10
mesh_pps: 0, 0
#   Keine Interpolation, das Raster ist dicht genug.
zero_reference_position: 177.5, 177.5
#   = Punkt, an dem G28 Z mit der Load-Cell misst (probe_x/probe_y in
#   indx/indx.cfg, -1 = Bettmitte). Der Scanner liefert dann nur die Bettform,
#   Z=0 kommt von der Load-Cell.
