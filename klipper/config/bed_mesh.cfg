#####################################################################
#  Bed mesh with the eddy scanner in the INDX Smart Head
#####################################################################
#  Replaces the [bed_mesh] part of the old cartographer.cfg.
#  The scanner is [probe_eddy_current scanner] in config/INDX_toolhead.cfg
#  (register_as_probe: False). The load cell stays the default probe,
#  so every mesh call has to select the scanner explicitly:
#
#      BED_MESH_CALIBRATE PROBE=scanner METHOD=rapid_scan
#
#  Without PROBE=scanner the load cell taps every point one by one,
#  without METHOD=rapid_scan the scanner stops at every point.
#
#  Calibrate once before first use (T0 on the head, nozzle cold):
#      G28
#      LDC_CALIBRATE_DRIVE_CURRENT CHIP=scanner
#      SAVE_CONFIG
#      G28
#      PROBE_EDDY_CURRENT_CALIBRATE CHIP=scanner
#      SAVE_CONFIG
#
#  Scan with a cold nozzle: the induction heater disturbs the scanner.
#####################################################################

[bed_mesh]
speed: 300
#   Scan-Geschwindigkeit. Meldet Kalico "Sample rate is not high enough",
#   lower it here or pass SCAN_SPEED= when calling.
horizontal_move_z: 2
#   Scan height. Must be above the scanner's z_offset (1.0).
mesh_min: 15, 40
#   Coordinates are SCANNER positions. The scanner sits 34.5 mm behind
#   the nozzle, so the nozzle is 34.5 mm further forward. Y >= clearance_y + 35,
#   so the nozzle does not move into the dock area while scanning.
mesh_max: 340, 340
probe_count: 20, 20
#   About 17 mm grid spacing, matching the coil diameter (~17.6 mm).
adaptive_margin: 10
mesh_pps: 0, 0
#   No interpolation, the grid is dense enough.
zero_reference_position: 177.5, 177.5
#   = point where G28 Z probes with the load cell (probe_x/probe_y in
#   indx/indx.cfg, -1 = bed centre). The scanner then only provides the bed shape,
#   Z=0 comes from the load cell.
