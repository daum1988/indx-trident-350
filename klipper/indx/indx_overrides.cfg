#####################################################################
#  Eigene Ueberschreibungen fuer INDX-Makros
#####################################################################
#  Diese Datei MUSS in printer.cfg NACH indx/homing.cfg eingebunden
#  werden. Klipper/Kalico fuegt gleichnamige Sektionen zusammen, die
#  spaeter gelesene Option gewinnt. So bleiben die INDX-Dateien
#  unveraendert und ein INDX-Update ueberschreibt diese Anpassungen nicht.
#  Nach einem INDX-Update die kopierten Makros mit dem Original vergleichen.
#####################################################################


#####################################################################
#  Z-Hop beim Homing: Schutz, wenn das Bett ganz unten steht
#####################################################################
#  _INDX_SAFE_Z_HOP faehrt bei ungehomtem Z blind probe_z_clearance
#  (10 mm) nach unten. Steht das Bett schon am unteren Ende, faehrt es
#  auf Anschlag. Ist der Schalter [gcode_button z_low] gedrueckt (Bett
#  im untersten Bereich), wird der Hop uebersprungen.
#  Ohne Schalter verhaelt sich das Makro wie das Original.

#[gcode_button z_low]
#pin: ^PXX
#   Freier Endstop-Eingang am Manta, anpassen. Bei einem NC-Schalter
#   (empfohlen, Kabelbruch = "gedrueckt" = sicher) den Pin mit ! invertieren.
#   Schalter so montieren, dass er im untersten ~15 mm Z-Weg gedrueckt ist.
#   Er loest KEIN M112 aus, er wird nur abgefragt.
#press_gcode:
#release_gcode:

[gcode_macro _INDX_SAFE_Z_HOP]
gcode:
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    {% set z_clr = tp.probe_z_clearance|float %}
    {% set has_switch = "gcode_button z_low" in printer %}
    {% set bed_low = has_switch and printer["gcode_button z_low"].state == "PRESSED" %}
    {% if "z" not in printer.toolhead.homed_axes %}
        {% if bed_low %}
            RESPOND MSG="Bett steht unten (z_low gedrueckt): Z-Hop uebersprungen"
        {% else %}
            SET_KINEMATIC_POSITION Z=0 SET_HOMED=Z
            G91
            G0 Z{z_clr} F{tp.home_z_feedrate|default(900)|int}
            G90
            # Empty SET_HOMED= is required: CLEAR_HOMED=Z alone defaults SET_HOMED=XYZ
            SET_KINEMATIC_POSITION SET_HOMED= CLEAR_HOMED=Z
        {% endif %}
    {% elif printer.toolhead.position.z|float < z_clr %}
        G90
        G0 Z{z_clr} F{tp.home_z_feedrate|default(900)|int}
    {% endif %}


#####################################################################
#  LOAD_FILAMENT mit Bucket und Speichern des Messwerts pro Tool
#####################################################################
#  Kopie von LOAD_FILAMENT aus indx/indx-cal.cfg, ergaenzt um:
#   - Fahrt zum Bucket (MOVE_TO_BUCKET) nach der Toolaufnahme
#   - clean_nozzle nach dem Primen
#   - MEASURE ist standardmaessig 1 (messen), MEASURE=0 nimmt den Preset
#   - TOOL ist optional, ohne TOOL= wird das aktive Tool geladen
#   - MEASURE=1: Messwert zusaetzlich beim Tool speichern (_LF_STORE_MEASURED)
#  variable_filament_presets kommt weiter aus indx-cal.cfg.

[gcode_macro LOAD_FILAMENT]
gcode:
    {% set presets = printer["gcode_macro LOAD_FILAMENT"].filament_presets %}
    # Ohne TOOL= wird das aktive Tool genommen
    {% set act = printer.save_variables.variables.active_tool|default(-1)|int %}
    {% set t = params.TOOL|default(act)|int %}
    {% if t < 0 %}
        {action_raise_error("Kein Tool aktiv. LOAD_FILAMENT TOOL=<n> TYPE=<material> angeben oder erst ein Tool aufnehmen.")}
    {% endif %}
    {% set type    = params.TYPE|default("")|upper %}
    # Standard ist hier MEASURE=1 (INDX-Original: 0). Die Presets lagen bei
    # diesem Drucker deutlich unter den gemessenen Werten, was zur Abschaltung
    # durch das Sicherheitsmodell fuehrte. MEASURE=0 erzwingt den Preset.
    {% set measure = params.MEASURE|default(1)|int %}

    {% if type and type not in presets %}
        {action_raise_error("Unknown TYPE '%s'. Known types: %s" % (type, presets|join(", ")))}
    {% endif %}

    {% if 'TEMP' in params %}
        {% set temp = params.TEMP|float %}
    {% elif type %}
        {% set temp = presets[type]['temp']|float %}
    {% else %}
        {action_raise_error("Provide TYPE=<material> or TEMP=<c>.")}
    {% endif %}

    # 1. Tool aufnehmen (kalt)
    CHANGE_TOOL TOOL={t}

    # 1b. Zum Bucket fahren, bevor geheizt und gepurged wird
    MOVE_TO_BUCKET

    # 2. Filament-Parameter fuer das Sicherheitsmodell (nicht beim Messen)
    {% if type and not measure %}
        SET_TOOL_FILAMENT TOOL={t} DENSITY={presets[type]['density']} HEAT_CAPACITY={presets[type]['hc']}
        RESPOND TYPE=error MSG="LOAD_FILAMENT: T{t} nutzt den {type}-PRESET (density {presets[type]['density']}, heat capacity {presets[type]['hc']}) statt eines Messwerts. Das Sicherheitsmodell kann damit beim Drucken abschalten."
    {% endif %}

    # 3. Heizen
    RESPOND MSG="LOAD_FILAMENT: heating T{t} to {temp|int} C..."
    M104 S{temp}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={temp - 3} MAXIMUM={temp + 3}

    # 4. Laden und Primen (ueber dem Bucket)
    {% if type and 'speed' in presets[type] %}
        RESPOND MSG="LOAD_FILAMENT: feeding at {presets[type]['speed']} mm/s ({type} preset)"
        INDX_LOAD_FILAMENT APPLY={measure} SPEED={presets[type]['speed']}
    {% else %}
        INDX_LOAD_FILAMENT APPLY={measure}
    {% endif %}
    {% if measure %}
        # Messwert auch beim Tool speichern. Sonst setzt jede Aufnahme des
        # Tools wieder den alten Wert (_APPLY_TOOL_FILAMENT), und das
        # Sicherheitsmodell schaltet beim Drucken ab.
        _LF_STORE_MEASURED TOOL={t}
    {% endif %}

    # 5. Faden abstreifen, solange die Duese noch heiss ist
    clean_nozzle

[gcode_macro _LF_STORE_MEASURED]
description: Inner - gemessene Filamentwerte aus INDX_LOAD_FILAMENT beim Tool speichern
# INDX_LOAD_FILAMENT APPLY=1 schreibt den Messwert nur ins aktive Modell und
# als ausstehende SAVE_CONFIG-Aenderung, nicht in t<n>_fil_density/_fil_hc.
# Dieses Makro wird erst nach INDX_LOAD_FILAMENT ausgewertet und liest den
# frischen Wert aus den ausstehenden SAVE_CONFIG-Werten.
# Plausibilitaetspruefung: gueltige Messungen lagen bei diesem Drucker bei
# Dichte x Waermekapazitaet = 2,2 bis 3,2. Ausreisser wie 0,37 (z.B. wenn
# das Filament beim Messen nicht sauber gefoerdert wurde) fuehren beim
# naechsten Laden/Drucken zur Abschaltung und werden deshalb verworfen.
variable_min_product: 1.5
variable_max_product: 4.5
gcode:
    {% set t = params.TOOL|int %}
    {% set me = printer["gcode_macro _LF_STORE_MEASURED"] %}
    {% set svv = printer.save_variables.variables %}
    {% set pend = printer.configfile.save_config_pending_items %}
    {% set ix = pend["indx"] if "indx" in pend else {} %}
    {% if "model_filament_density" in ix and "model_filament_heat_capacity" in ix %}
        {% set d = ix["model_filament_density"]|float %}
        {% set h = ix["model_filament_heat_capacity"]|float %}
        {% set p = d * h %}
        {% if p < me.min_product|float or p > me.max_product|float %}
            # Messung verwerfen, Modell auf den bisherigen Wert des Tools zuruecksetzen
            {% set od = svv.get("t" ~ t ~ "_fil_density") %}
            {% set oh = svv.get("t" ~ t ~ "_fil_hc") %}
            {% if od is not none and oh is not none %}
                INDX_SET_MODEL_PARAMS FILAMENT_DENSITY={od|float} FILAMENT_HEAT_CAPACITY={oh|float}
                {% set keep = "bisheriger Wert %.2f bleibt aktiv" % (od|float * oh|float) %}
            {% else %}
                INDX_SET_MODEL_PARAMS FILAMENT_DENSITY=1.0 FILAMENT_HEAT_CAPACITY=2.6
                {% set keep = "Ersatzwert 2.60 ist aktiv" %}
            {% endif %}
            RESPOND TYPE=error MSG="T{t}: Messung unplausibel ({'%.2f'|format(p)}, erwartet {me.min_product}-{me.max_product}) und NICHT gespeichert, {keep}. Kein SAVE_CONFIG ausfuehren. Foerderung von T{t} pruefen (Filament rutscht/klemmt?) und LOAD_FILAMENT wiederholen."
        {% else %}
            SET_TOOL_FILAMENT TOOL={t} DENSITY={d} HEAT_CAPACITY={h}
            RESPOND MSG="T{t}: Messwert beim Tool gespeichert (Dichte {d}, Waermekapazitaet {h})"
        {% endif %}
    {% else %}
        RESPOND TYPE=error MSG="T{t}: Messwert nicht gefunden. Bitte von Hand: SET_TOOL_FILAMENT TOOL={t} DENSITY=<Wert> HEAT_CAPACITY=<Wert> mit den Werten aus der Meldung oben."
    {% endif %}


#####################################################################
#  Gespeicherte Filamentwerte aller Tools anzeigen
#####################################################################
[gcode_macro SHOW_TOOL_FILAMENT]
description: Zeigt pro Tool die gespeicherten Filamentwerte fuer das INDX-Sicherheitsmodell
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set n = printer["gcode_macro TOOL_POSITIONS"].tool_count|default(9)|int %}
    {% set out = ["Filamentwerte pro Tool (Dichte x Waermekapazitaet):"] %}
    {% for i in range(n) %}
        {% set d = svv.get("t" ~ i ~ "_fil_density") %}
        {% set h = svv.get("t" ~ i ~ "_fil_hc") %}
        {% if d is none or h is none %}
            {% set _ = out.append("T%d: nichts gespeichert, uebernimmt den Wert des vorherigen Tools" % i) %}
        {% else %}
            {% set _ = out.append("T%d: %.4f x %.4f = %.2f" % (i, d|float, h|float, d|float * h|float)) %}
        {% endif %}
    {% endfor %}
    {action_respond_info(out|join("\n"))}


#####################################################################
#  CAL_VERIFY_XY: gespeicherte XY-Offsets an der Kamera pruefen
#####################################################################
#  CAL_VERIFY_XY TOOL=n
#  Holt Tool n mit dem normalen Toolwechsel (Offsets aktiv wie beim
#  Drucken) und faehrt in G-Code-Koordinaten auf die Kamera-Referenz
#  aus CAL_ONE_SET_CAMERA_REF. Stimmt der Offset, sitzt die Duese ohne
#  Nachjustieren im Fadenkreuz. Aendert nichts an den gespeicherten Werten.

[gcode_macro CAL_VERIFY_XY]
description: Tool n holen und mit aktiven Offsets auf die Kamera-Referenz fahren
gcode:
    {% set t = params.TOOL|default(-1)|int %}
    {% if t < 0 %}
        {action_raise_error("Usage: CAL_VERIFY_XY TOOL=n")}
    {% endif %}
    CHANGE_TOOL TOOL={t}
    _CAL_VERIFY_GOTO

[gcode_macro _CAL_VERIFY_GOTO]
description: Inner - Kamera-Referenz in G-Code-Koordinaten anfahren (nach dem Toolwechsel ausgewertet)
gcode:
    {% set svv = printer.save_variables.variables %}
    {% if 'cam_pos_x' not in svv %}
        {action_raise_error("Keine Kamera-Referenz. Erst CAL_ONE_SET_CAMERA_REF mit T0.")}
    {% endif %}
    {% set o = printer.gcode_move.homing_origin %}
    {% set cz = svv.cam_pos_z|float - o.z %}
    G90
    {% if printer.toolhead.position.z < svv.cam_pos_z|float + 5 %}
        G0 Z{cz + 5} F1500
    {% endif %}
    G0 X{svv.cam_pos_x|float} Y{svv.cam_pos_y|float} F8000
    G0 Z{cz} F1500
    M400
    RESPOND MSG="T{svv.active_tool|default('?')} an Kamera-Referenz (Offset X={'%.3f'|format(o.x)} Y={'%.3f'|format(o.y)}). Duese sollte im Fadenkreuz sitzen."


#####################################################################
#  CAL_Z: Messort
#####################################################################
#  CAL_Z berechnet den Messort aus den ACHSGRENZEN, nicht aus dem Bett.
#  Mit "rear" ergibt das Y = position_max(390) - 5 - 5 = 380, und dort
#  liegt hinter dem Bett nur Bucket/Abstreifer -> "No trigger on probe".
#  "center" = Mitte der Achsgrenzen (ca. X177.5 / Y170), sicher auf dem Bett.
#  Nur diese Variable wird ueberschrieben, das gcode bleibt aus indx-cal.cfg.
[gcode_macro CAL_Z]
variable_probe_location: "center"


#####################################################################
#  Spoolman: Spule beim Toolwechsel umschalten
#####################################################################
#  Kopie von _INDX_SET_ACTIVE_TOOL aus indx-tc-macros.cfg, ergaenzt um
#  eine Zeile am Ende (_SPOOL_SYNC, siehe macros/spoolman.cfg). Alle
#  Schreibzugriffe auf active_tool laufen hier durch: Pickup
#  (_RECORD_TOOLCHANGE), Parken (TOOL=-1) und Start (INIT_STATE).
#  Nach einem INDX-Update mit dem Original vergleichen.
#####################################################################
[gcode_macro _INDX_SET_ACTIVE_TOOL]
gcode:
    {% set t = params.TOOL|int %}
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    SAVE_VARIABLE VARIABLE=active_tool VALUE={t}
    {% for i in range(tp.tool_count|int) %}
        {% set name = "gcode_macro T" ~ i %}
        {% if name in printer and printer[name].active is defined %}
            SET_GCODE_VARIABLE MACRO=T{i} VARIABLE=active VALUE={"True" if i == t else "False"}
        {% endif %}
    {% endfor %}
    # Spoolman: Spule des neuen Tools aktivieren, bei -1 loeschen
    {% if "gcode_macro _SPOOL_SYNC" in printer %}
        _SPOOL_SYNC TOOL={t}
    {% endif %}
