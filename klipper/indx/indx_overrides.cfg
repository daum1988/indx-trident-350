#####################################################################
#  Custom overrides for INDX macros
#####################################################################
#  This file MUST be included in printer.cfg AFTER indx/homing.cfg.
#  Klipper/Kalico merges sections with the same name, the option
#  read last wins. This keeps the INDX files
#  unchanged, and an INDX update does not overwrite these changes.
#  After an INDX update, compare the copied macros with the original.
#####################################################################


#####################################################################
#  Z hop on homing: protection when the bed is all the way down
#####################################################################
#  With Z not homed, _INDX_SAFE_Z_HOP blindly moves probe_z_clearance
#  (10 mm) down. If the bed is already at the bottom end, it runs
#  into the hard stop. If switch [gcode_button z_low] is pressed (bed
#  in the lowest range), the hop is skipped.
#  Without the switch the macro behaves like the original.

#[gcode_button z_low]
#pin: ^PXX
#   Free endstop input on the Manta, adjust. With an NC switch
#   (recommended, broken wire = "pressed" = safe) invert the pin with !.
#   Mount the switch so it is pressed in the lowest ~15 mm of Z travel.
#   It does NOT trigger M112, it is only queried.
#press_gcode:
#release_gcode:

[gcode_macro _INDX_SAFE_Z_HOP]
gcode:
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    {% set z_clr = tp.probe_z_clearance|float %}
    {% set has_switch = "gcode_button z_low" in printer %}
    {% set bed_low = has_switch and printer["gcode_button z_low"].state == "PRESSED" %}
    {% if "z" not in printer.toolhead.homed_axes %}
        {% if bed_low %}
            RESPOND MSG="Bed is at the bottom (z_low pressed): Z hop skipped"
        {% else %}
            SET_KINEMATIC_POSITION Z=0 SET_HOMED=Z
            G91
            G0 Z{z_clr} F{tp.home_z_feedrate|default(900)|int}
            G90
            # Empty SET_HOMED= is required: CLEAR_HOMED=Z alone defaults SET_HOMED=XYZ
            SET_KINEMATIC_POSITION SET_HOMED= CLEAR_HOMED=Z
        {% endif %}
    {% elif printer.toolhead.position.z|float < z_clr %}
        G90
        G0 Z{z_clr} F{tp.home_z_feedrate|default(900)|int}
    {% endif %}


#####################################################################
#  LOAD_FILAMENT with bucket and storing the measured value per tool
#####################################################################
#  Copy of LOAD_FILAMENT from indx/indx-cal.cfg, extended with:
#   - move to the bucket (MOVE_TO_BUCKET) after picking up the tool
#   - clean_nozzle after priming
#   - MEASURE defaults to 1 (measure), MEASURE=0 uses the preset
#   - TOOL is optional, without TOOL= the active tool is loaded
#   - MEASURE=1: also store the measured value with the tool (_LF_STORE_MEASURED)
#  variable_filament_presets still comes from indx-cal.cfg.

[gcode_macro LOAD_FILAMENT]
gcode:
    {% set presets = printer["gcode_macro LOAD_FILAMENT"].filament_presets %}
    # Without TOOL= the active tool is used
    {% set act = printer.save_variables.variables.active_tool|default(-1)|int %}
    {% set t = params.TOOL|default(act)|int %}
    {% if ('TYPE' not in params and 'TEMP' not in params) or t < 0 %}
    # Called without material (KlipperScreen Load button, Mainsail) or without
    # any tool: open the tool/material dialog (macros/filament_menu.cfg)
    _FIL_PROMPT MODE=LOAD TOOL={params.TOOL|default(-1)} TYPE={params.TYPE|default("")}
    {% else %}
    RESPOND TYPE=command MSG="action:prompt_end"
    {% if t < 0 %}
        {action_raise_error("No tool active. Pass LOAD_FILAMENT TOOL=<n> TYPE=<material> or pick up a tool first.")}
    {% endif %}
    {% set type    = params.TYPE|default("")|upper %}
    # Default here is MEASURE=1 (INDX original: 0). On this printer the presets
    # were well below the measured values, which led to shutdowns
    # by the safety model. MEASURE=0 forces the preset.
    {% set measure = params.MEASURE|default(1)|int %}

    {% if type and type not in presets %}
        {action_raise_error("Unknown TYPE '%s'. Known types: %s" % (type, presets|join(", ")))}
    {% endif %}

    {% if 'TEMP' in params %}
        {% set temp = params.TEMP|float %}
    {% elif type %}
        {% set temp = presets[type]['temp']|float %}
    {% else %}
        {action_raise_error("Provide TYPE=<material> or TEMP=<c>.")}
    {% endif %}

    # 1. Pick up tool (cold)
    CHANGE_TOOL TOOL={t}

    # 1a. SPOOL=<id> (from the spool dialog): assign the spool to this tool
    #     before loading, so the purge is booked to it. A spool can only be
    #     in one tool, so other tools holding it are cleared.
    {% set spool = params.SPOOL|default(0)|int %}
    {% if spool > 0 and "gcode_macro SET_TOOL_SPOOL" in printer %}
        {% for i in range(printer["gcode_macro TOOL_POSITIONS"].tool_count|default(9)|int) %}
            {% set name = "gcode_macro T" ~ i %}
            {% if i != t and name in printer and printer[name].spool_id|int(0) == spool %}
                SET_TOOL_SPOOL T={i} ID=0
            {% endif %}
        {% endfor %}
        SET_TOOL_SPOOL T={t} ID={spool}
    {% endif %}

    # 1b. Move to the bucket before heating and purging
    MOVE_TO_BUCKET

    # 2. Filament parameters for the safety model (not when measuring)
    {% if type and not measure %}
        SET_TOOL_FILAMENT TOOL={t} DENSITY={presets[type]['density']} HEAT_CAPACITY={presets[type]['hc']}
        RESPOND TYPE=error MSG="LOAD_FILAMENT: T{t} uses the {type} PRESET (density {presets[type]['density']}, heat capacity {presets[type]['hc']}) instead of a measured value. The safety model may shut down while printing with it."
    {% endif %}

    # 3. Heat
    RESPOND MSG="LOAD_FILAMENT: heating T{t} to {temp|int} C..."
    M104 S{temp}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={temp - 3} MAXIMUM={temp + 3}

    # 4. Load and prime (over the bucket)
    {% if type and 'speed' in presets[type] %}
        RESPOND MSG="LOAD_FILAMENT: feeding at {presets[type]['speed']} mm/s ({type} preset)"
        INDX_LOAD_FILAMENT APPLY={measure} SPEED={presets[type]['speed']}
    {% else %}
        INDX_LOAD_FILAMENT APPLY={measure}
    {% endif %}
    {% if measure %}
        # Also store the measured value with the tool. Otherwise every pickup
        # of the tool restores the old value (_APPLY_TOOL_FILAMENT), and the
        # safety model shuts down while printing.
        _LF_STORE_MEASURED TOOL={t}
    {% endif %}

    # 5. Wipe off the strand while the nozzle is still hot
    clean_nozzle

    # 6. Remember that this tool has filament (KlipperScreen INDX panel)
    SAVE_VARIABLE VARIABLE=t{t}__loaded VALUE=1
    {% endif %}

[gcode_macro _LF_STORE_MEASURED]
description: Inner - store measured filament values from INDX_LOAD_FILAMENT with the tool
# INDX_LOAD_FILAMENT APPLY=1 writes the measured value only to the active model and
# as a pending SAVE_CONFIG change, not to t<n>_fil_density/_fil_hc.
# This macro is evaluated only after INDX_LOAD_FILAMENT and reads the
# fresh value from the pending SAVE_CONFIG values.
# Plausibility check: valid measurements on this printer were
# density x heat capacity = 2.2 to 3.2. Outliers like 0.37 (e.g. when
# the filament was not fed cleanly while measuring) lead to a shutdown on the
# next load/print and are therefore discarded.
variable_min_product: 1.5
variable_max_product: 4.5
gcode:
    {% set t = params.TOOL|int %}
    {% set me = printer["gcode_macro _LF_STORE_MEASURED"] %}
    {% set svv = printer.save_variables.variables %}
    {% set pend = printer.configfile.save_config_pending_items %}
    {% set ix = pend["indx"] if "indx" in pend else {} %}
    {% if "model_filament_density" in ix and "model_filament_heat_capacity" in ix %}
        {% set d = ix["model_filament_density"]|float %}
        {% set h = ix["model_filament_heat_capacity"]|float %}
        {% set p = d * h %}
        {% if p < me.min_product|float or p > me.max_product|float %}
            # Discard the measurement, reset the model to the tool's previous value
            {% set od = svv.get("t" ~ t ~ "_fil_density") %}
            {% set oh = svv.get("t" ~ t ~ "_fil_hc") %}
            {% if od is not none and oh is not none %}
                INDX_SET_MODEL_PARAMS FILAMENT_DENSITY={od|float} FILAMENT_HEAT_CAPACITY={oh|float}
                {% set keep = "previous value %.2f stays active" % (od|float * oh|float) %}
            {% else %}
                INDX_SET_MODEL_PARAMS FILAMENT_DENSITY=1.0 FILAMENT_HEAT_CAPACITY=2.6
                {% set keep = "fallback value 2.60 is active" %}
            {% endif %}
            RESPOND TYPE=error MSG="T{t}: measurement implausible ({'%.2f'|format(p)}, expected {me.min_product}-{me.max_product}) and NOT saved, {keep}. Do not run SAVE_CONFIG. Check the feeding of T{t} (filament slipping/jammed?) and repeat LOAD_FILAMENT."
        {% else %}
            SET_TOOL_FILAMENT TOOL={t} DENSITY={d} HEAT_CAPACITY={h}
            RESPOND MSG="T{t}: measured value stored with the tool (density {d}, heat capacity {h})"
        {% endif %}
    {% else %}
        RESPOND TYPE=error MSG="T{t}: measured value not found. Set it by hand: SET_TOOL_FILAMENT TOOL={t} DENSITY=<value> HEAT_CAPACITY=<value> with the values from the message above."
    {% endif %}


#####################################################################
#  Show stored filament values of all tools
#####################################################################
[gcode_macro SHOW_TOOL_FILAMENT]
description: Shows the stored filament values per tool for the INDX safety model
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set n = printer["gcode_macro TOOL_POSITIONS"].tool_count|default(9)|int %}
    {% set out = ["Filament values per tool (density x heat capacity):"] %}
    {% for i in range(n) %}
        {% set d = svv.get("t" ~ i ~ "_fil_density") %}
        {% set h = svv.get("t" ~ i ~ "_fil_hc") %}
        {% if d is none or h is none %}
            {% set _ = out.append("T%d: nothing stored, keeps the value of the previous tool" % i) %}
        {% else %}
            {% set _ = out.append("T%d: %.4f x %.4f = %.2f" % (i, d|float, h|float, d|float * h|float)) %}
        {% endif %}
    {% endfor %}
    {action_respond_info(out|join("\n"))}


#####################################################################
#  CAL_VERIFY_XY: check stored XY offsets at the camera
#####################################################################
#  CAL_VERIFY_XY TOOL=n
#  Picks up tool n with the normal tool change (offsets active as when
#  printing) and moves in G-code coordinates to the camera reference
#  from CAL_ONE_SET_CAMERA_REF. If the offset is right, the nozzle sits in the
#  crosshair without adjustment. Does not change any stored values.

[gcode_macro CAL_VERIFY_XY]
description: Pick up tool n and move to the camera reference with active offsets
gcode:
    {% set t = params.TOOL|default(-1)|int %}
    {% if t < 0 %}
        {action_raise_error("Usage: CAL_VERIFY_XY TOOL=n")}
    {% endif %}
    CHANGE_TOOL TOOL={t}
    _CAL_VERIFY_GOTO

[gcode_macro _CAL_VERIFY_GOTO]
description: Inner - move to the camera reference in G-code coordinates (evaluated after the tool change)
gcode:
    {% set svv = printer.save_variables.variables %}
    {% if 'cam_pos_x' not in svv %}
        {action_raise_error("No camera reference. Run CAL_ONE_SET_CAMERA_REF with T0 first.")}
    {% endif %}
    {% set o = printer.gcode_move.homing_origin %}
    {% set cz = svv.cam_pos_z|float - o.z %}
    G90
    {% if printer.toolhead.position.z < svv.cam_pos_z|float + 5 %}
        G0 Z{cz + 5} F1500
    {% endif %}
    G0 X{svv.cam_pos_x|float} Y{svv.cam_pos_y|float} F8000
    G0 Z{cz} F1500
    M400
    RESPOND MSG="T{svv.active_tool|default('?')} at camera reference (offset X={'%.3f'|format(o.x)} Y={'%.3f'|format(o.y)}). The nozzle should sit in the crosshair."


#####################################################################
#  CAL_Z: Messort
#####################################################################
#  CAL_Z computes the probe location from the AXIS LIMITS, not from the bed.
#  With "rear" that gives Y = position_max(390) - 5 - 5 = 380, and there
#  only the bucket/wiper is behind the bed -> "No trigger on probe".
#  "center" = middle of the axis limits (approx. X177.5 / Y170), safely on the bed.
#  Only this variable is overridden, the gcode stays from indx-cal.cfg.
[gcode_macro CAL_Z]
variable_probe_location: "center"


#####################################################################
#  Spoolman: switch spool on tool change
#####################################################################
#  Copy of _INDX_SET_ACTIVE_TOOL from indx-tc-macros.cfg, extended with
#  one line at the end (_SPOOL_SYNC, see macros/spoolman.cfg). All
#  writes to active_tool go through here: pickup
#  (_RECORD_TOOLCHANGE), parking (TOOL=-1) and startup (INIT_STATE).
#  After an INDX update, compare with the original.
#####################################################################
[gcode_macro _INDX_SET_ACTIVE_TOOL]
gcode:
    {% set t = params.TOOL|int %}
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    SAVE_VARIABLE VARIABLE=active_tool VALUE={t}
    {% for i in range(tp.tool_count|int) %}
        {% set name = "gcode_macro T" ~ i %}
        {% if name in printer and printer[name].active is defined %}
            SET_GCODE_VARIABLE MACRO=T{i} VARIABLE=active VALUE={"True" if i == t else "False"}
        {% endif %}
    {% endfor %}
    # Spoolman: activate the new tool's spool, clear it on -1
    {% if "gcode_macro _SPOOL_SYNC" in printer %}
        _SPOOL_SYNC TOOL={t}
    {% endif %}


#####################################################################
#  INIT_STATE: read the saved state when it runs, not when it is queued
#####################################################################
#  A delayed_gcode renders its template when the timer fires (5 s after
#  start) and only then waits for the G-code queue. If a G28 is already
#  running, the original applied the active_tool it had read before the
#  G28: the homing fetched T0, then INIT_STATE set active_tool back to
#  the old tool. The next tool change parked T0 in the wrong dock
#  (seen 2026-11-20). A gcode_macro renders only when it executes, so
#  the body moves into _INDX_INIT_STATE and reads the current values.
#  Same content as the original INIT_STATE in indx-tc-macros.cfg, plus:
#
#  The filament values of the safety model (t<n>_fil_density/_fil_hc) are
#  only restored on a tool pickup (_APPLY_TOOL_FILAMENT). After a restart
#  with a tool already on the head there is no pickup, so the model ran
#  with the value from printer.cfg instead (1.19 instead of 2.92 for ABS in
#  T0) and shut down 3 minutes into the print: "Modelled nozzle
#  temperature 319.6 exceeds measured temperature of 269.6" (2026-11-22).
#  So the active tool's values are applied here as well.

[delayed_gcode INIT_STATE]
gcode:
    _INDX_INIT_STATE

[gcode_macro _INDX_INIT_STATE]
description: Inner - INIT_STATE body, evaluated when it runs
gcode:
    _INDX_BUILD_TOOLS
    {% set svv = printer.save_variables.variables %}
    SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=toolhead_state VALUE={svv.toolhead_state|default(0)|int}
    MODE_{svv.tc_mode|default("NORMAL")|upper}
    _INDX_SET_ACTIVE_TOOL TOOL={svv.active_tool|default(-1)|int}
    {% if svv.active_tool|default(-1)|int >= 0 %}
        _APPLY_TOOL_FILAMENT TOOL={svv.active_tool|int}
    {% endif %}
    TOOL_STATUS
