# Bucket und Duesen-Abstreifer sind feste Teile am Rahmen. Ihre Positionen
# sind deshalb MASCHINEN-Koordinaten. Seit INDX pro Tool einen XY-Offset
# setzt (SET_GCODE_OFFSET), rechnen diese Makros den aktiven G-Code-Offset
# heraus. Sonst landet z.B. G0 X0 bei einem Tool mit Offset X=-0.05 auf
# Maschine X=-0.05 und Kalico meldet "Move out of range".

#####################################################################
#  Positionen - NUR HIER anpassen, wenn Bucket/Abstreifer verschoben werden
#####################################################################
#  Werte ermitteln: Tool 0 aufnehmen, Duese von Hand ueber die Stelle
#  fahren, dann GET_POSITION ausfuehren und X/Y aus der Zeile
#  "toolhead:" ablesen (das sind Maschinenkoordinaten).
#  Danach FIRMWARE_RESTART bzw. "Speichern & Neustart".
[gcode_macro _BUCKET_VARS]
# Purge-Positionen ueber dem Bucket (MOVE_TO_BUCKET waehlt zufaellig links/rechts)
variable_purge_left_x:  5
variable_purge_right_x: 85
variable_purge_y:       389
# Abstreifer (clean_nozzle faehrt 10x zwischen den beiden X-Werten hin und her)
variable_brush_x_start: 25
variable_brush_x_end:   65
variable_brush_y:       378
variable_brush_wipes:   10
gcode:

[gcode_macro MOVE_TO_BUCKET]
gcode:
    {% set b = printer["gcode_macro _BUCKET_VARS"] %}
    ; select left/right bucket randomly
    {% set x_pos = b.purge_left_x if (range(0, 2)|random) == 0 else b.purge_right_x %}

    _ENSURE_HOMED
    _BUCKET_MOVE X={x_pos} Y={b.purge_y} F=36000

[gcode_macro clean_nozzle]
gcode:
    {% set b = printer["gcode_macro _BUCKET_VARS"] %}
    # Rueckkehrposition in G-Code-Koordinaten merken. toolhead.position waeren
    # Maschinenkoordinaten und wuerden um den Tool-Offset daneben liegen.
    {% set gp = printer.gcode_move.gcode_position %}
    {% set old_pos_x = gp.x %}
    {% set old_pos_y = gp.y %}

    SAVE_GCODE_STATE NAME=clean_nozzle_state

    M400
    {% for i in range(b.brush_wipes|int) %}
        _BUCKET_MOVE X={b.brush_x_end} Y={b.brush_y} F=36000
        _BUCKET_MOVE X={b.brush_x_start} Y={b.brush_y} F=36000
    {% endfor %}
    # go back to previous position
    G90
    G0 X{old_pos_x} Y{old_pos_y} F36000

    RESTORE_GCODE_STATE NAME=clean_nozzle_state

[gcode_macro _BUCKET_MOVE]
description: Inner - faehrt auf MASCHINEN-Koordinaten X/Y, unabhaengig vom aktiven Tool-Offset
gcode:
    {% set th = printer.toolhead %}
    {% set o = printer.gcode_move.homing_origin %}
    # Ziel auf die Achsgrenzen begrenzen, falls die Bucket-Werte nicht mehr passen
    {% set x = [[params.X|float, th.axis_minimum.x]|max, th.axis_maximum.x]|min %}
    {% set y = [[params.Y|float, th.axis_minimum.y]|max, th.axis_maximum.y]|min %}
    G90
    G0 X{x - o.x} Y{y - o.y} F{params.F|default(12000)}
