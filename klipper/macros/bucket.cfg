# Bucket and nozzle wiper are fixed parts on the frame. Their positions
# are therefore MACHINE coordinates. Since INDX sets an XY offset per tool
# (SET_GCODE_OFFSET), these macros subtract the active G-code offset.
# Otherwise e.g. G0 X0 with a tool offset of X=-0.05 ends up at
# machine X=-0.05 and Kalico reports "Move out of range".

#####################################################################
#  Positions - adjust ONLY HERE when the bucket/wiper is moved
#####################################################################
#  Finding the values: pick up tool 0, move the nozzle over the spot by hand,
#  then run GET_POSITION and read X/Y from the
#  "toolhead:" line (these are machine coordinates).
#  Danach FIRMWARE_RESTART bzw. "Speichern & Neustart".
[gcode_macro _BUCKET_VARS]
# Purge positions over the bucket (MOVE_TO_BUCKET picks left/right at random)
variable_purge_left_x:  5
variable_purge_right_x: 85
variable_purge_y:       389
# Wiper (clean_nozzle moves back and forth 10x between the two X values)
variable_brush_x_start: 25
variable_brush_x_end:   65
variable_brush_y:       378
variable_brush_wipes:   10
gcode:

[gcode_macro MOVE_TO_BUCKET]
gcode:
    {% set b = printer["gcode_macro _BUCKET_VARS"] %}
    ; select left/right bucket randomly
    {% set x_pos = b.purge_left_x if (range(0, 2)|random) == 0 else b.purge_right_x %}

    _ENSURE_HOMED
    _BUCKET_MOVE X={x_pos} Y={b.purge_y} F=36000

[gcode_macro clean_nozzle]
gcode:
    {% set b = printer["gcode_macro _BUCKET_VARS"] %}
    # Remember the return position in G-code coordinates. toolhead.position would be
    # machine coordinates and would be off by the tool offset.
    {% set gp = printer.gcode_move.gcode_position %}
    {% set old_pos_x = gp.x %}
    {% set old_pos_y = gp.y %}

    SAVE_GCODE_STATE NAME=clean_nozzle_state

    M400
    {% for i in range(b.brush_wipes|int) %}
        _BUCKET_MOVE X={b.brush_x_end} Y={b.brush_y} F=36000
        _BUCKET_MOVE X={b.brush_x_start} Y={b.brush_y} F=36000
    {% endfor %}
    # go back to previous position
    G90
    G0 X{old_pos_x} Y{old_pos_y} F36000

    RESTORE_GCODE_STATE NAME=clean_nozzle_state

[gcode_macro _BUCKET_MOVE]
description: Inner - moves to MACHINE coordinates X/Y, independent of the active tool offset
gcode:
    {% set th = printer.toolhead %}
    {% set o = printer.gcode_move.homing_origin %}
    # Clamp the target to the axis limits in case the bucket values no longer fit
    {% set x = [[params.X|float, th.axis_minimum.x]|max, th.axis_maximum.x]|min %}
    {% set y = [[params.Y|float, th.axis_minimum.y]|max, th.axis_maximum.y]|min %}
    G90
    G0 X{x - o.x} Y{y - o.y} F{params.F|default(12000)}
