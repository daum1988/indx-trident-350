#####################################################################
#  Shared macros
#####################################################################
#  Used by the print macros (trident_macros.cfg) AND by the INDX
#  extensions of this repo:
#    _global_var       settings; load_filament_extruder_temp is used by
#                      UNLOAD_FILAMENT and the spool dialog (filament_menu.cfg),
#                      the park/pause values by the print macros
#    _ENSURE_HOMED     homes only if needed (bucket.cfg)
#    UNLOAD_FILAMENT   unload with tool selection (filament_menu.cfg,
#                      KlipperScreen Unload button)
#  Kept separate so the extensions can be used with your own print macros.
#####################################################################

[gcode_macro _global_var]
# Park position rear centre, away from the docks at the front. Used for
# PAUSE, CANCEL_PRINT and END_PRINT via the _PARK_HEAD macro.
#   park_x = -1: centre between position_min and position_max of X
#   park_y = -1: position_max of Y minus park_margin_y
#   A number instead of -1 sets a fixed position.
variable_park_x: -1
variable_park_y: -1
variable_park_margin_y: 5
# x/y here are no longer used, only e (retract on pause)
variable_pause_park:{'x': 175, 'y': 380, 'z': 50, 'e': 1}
variable_cancel_park:{'x': 175, 'y': 380, 'z': 10, 'e': 1}
# Distance (mm) to position_max of [stepper_z] that is never reached.
# Buffer for Z_TILT corrections and bed mesh compensation. Replaces the old
# fixed z_maximum_lifting_distance (295 was even above position_max 294).
# 15 instead of 5: on the next G28 _INDX_SAFE_Z_HOP blindly moves 10 mm
# (probe_z_clearance) + 1 mm tool z_hop down, that still has to fit.
# With switch [gcode_button z_low] (indx_overrides.cfg) this can go down to 3.
variable_z_park_margin: 15
variable_pause_resume_travel_speed: 150
variable_bed_mesh_calibrate_target_temp: 65
variable_load_filament_extruder_temp: 250
variable_heat_soak_time: 0 # in minutes
gcode:

[gcode_macro _ENSURE_HOMED]
description: Homes X/Y/Z only if the toolhead isn't already homed
gcode:
    {% if printer.toolhead.homed_axes|lower != "xyz" %}
        M117 Homing...
        G28
    {% endif %}

# LOAD_FILAMENT: see indx/indx-cal.cfg and indx_overrides.cfg (with bucket)

[gcode_macro UNLOAD_FILAMENT]
gcode:
    {% set extruder_temp = printer['gcode_macro _global_var'].load_filament_extruder_temp|int %}
    {% set current_target_temp  = printer.extruder.target|int %}
    {% set state = printer.print_stats.state %}
    {% set act = printer.save_variables.variables.active_tool|default(-1)|int %}
    # Tool to unload: TOOL=n, otherwise the active tool
    {% set ut = params.TOOL|default(act)|int %}

    {% if state != "printing" and state != "paused" and 'TOOL' not in params %}
        # Called without TOOL= (KlipperScreen Unload button, Mainsail):
        # open the tool dialog (macros/filament_menu.cfg)
        _FIL_PROMPT MODE=UNLOAD
    {% elif state != "printing" %}
        RESPOND TYPE=command MSG="action:prompt_end"
        {% if ut != act %}
            {% if state == "paused" %}
                {action_raise_error("UNLOAD_FILAMENT: during a pause only the active tool T%d can be unloaded." % act)}
            {% endif %}
            CHANGE_TOOL TOOL={ut}
        {% endif %}
        {% if state != "paused" %}
            M104 S{extruder_temp}
            M117 Nozzle heating...
            {action_respond_info("Nozzle not hot enough!")}
            {action_respond_info("Nozzle heating...")}
            M109 S{extruder_temp}
        {% else %}
            {% if printer.extruder.target == 0 %}
                M104 S{extruder_temp}
                M117 Nozzle heating...
                {action_respond_info("Nozzle not hot enough!")}
                {action_respond_info("Nozzle heating...")}
                M109 S{extruder_temp}
            {% else %}
                M104 S{printer.extruder.target}
                M117 Nozzle heating...
                {action_respond_info("Nozzle not hot enough!")}
                {action_respond_info("Nozzle heating...")}
                M109 S{printer.extruder.target}
            {% endif %}
        {% endif %}
        MOVE_TO_BUCKET
        M117 Retracting...
        G91
        G1 E+25 F300
        G1 E-10 F1500
        G1 E-20 F600
        M400
        G4 P3000
        # in two parts: with flow >100% (M221) -50 mm would exceed max_extrude_only_distance (50)
        G1 E-25 F300
        G1 E-25 F300
        G90
        M400
        M117 Retract Finish
        M400
        # Spoolman: filament is out, clear the tool's spool assignment
        {% if ut >= 0 and "gcode_macro SET_TOOL_SPOOL" in printer %}
            SET_TOOL_SPOOL T={ut} ID=0
        {% endif %}
        # Remember that this tool is empty (KlipperScreen INDX panel)
        {% if ut >= 0 %}
            SAVE_VARIABLE VARIABLE=t{ut}__loaded VALUE=0
        {% endif %}
        # Wipe off strands/drips while the nozzle is still hot (like LOAD_FILAMENT)
        clean_nozzle
        # Then cool down. When the print is paused the nozzle stays hot so it can continue.
        {% if current_target_temp == 0 or state != "paused"%}
            M104 S0
            M117 Nozzle cooling down
            RESPOND MSG="UNLOAD_FILAMENT: done, nozzle cleaned, heater off"
        {% endif %}
    {% else %}
        {action_respond_info("Don't unload filament during printing!!!")}
    {% endif %}
