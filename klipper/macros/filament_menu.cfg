#####################################################################
#  Tool / material selection dialog for LOAD_FILAMENT and UNLOAD_FILAMENT
#
#  KlipperScreen's Load/Unload buttons (extrude panel) send a bare
#  "LOAD_FILAMENT SPEED=..." / "UNLOAD_FILAMENT SPEED=...". On the INDX the
#  macros need a tool (and for loading a material), so a bare call opens
#  this dialog (macro prompt). It shows up in KlipperScreen and in Mainsail.
#
#    LOAD_FILAMENT    -> choose tool -> choose spool from Spoolman
#                        -> LOAD_FILAMENT TOOL=n SPOOL=id TYPE=x TEMP=c
#                        ("Without spool": choose a material preset instead)
#    UNLOAD_FILAMENT  -> choose tool -> UNLOAD_FILAMENT TOOL=n
#
#  The active tool is highlighted. The spool list comes from
#  scripts/spool_picker/spool_picker.py (via Moonraker's Spoolman proxy),
#  the material presets from LOAD_FILAMENT's filament_presets
#  (indx/indx-cal.cfg). Without Spoolman set variable_use_spoolman to 0.
#####################################################################

[gcode_macro _FIL_PROMPT]
description: Inner - tool/material dialog for LOAD_FILAMENT / UNLOAD_FILAMENT
variable_tool_count: 9
variable_use_spoolman: 1
gcode:
    {% set mode = params.MODE|default("LOAD")|upper %}
    {% set t = params.TOOL|default(-1)|int %}
    {% set type = params.TYPE|default("")|upper %}
    {% set spoolman = printer["gcode_macro _FIL_PROMPT"].use_spoolman|int and not params.PRESETS|default(0)|int %}
    {% if mode == "LOAD" and t >= 0 and spoolman %}
    _SPOOL_PICKER TOOL={t}
    {% else %}
    {% set act = printer.save_variables.variables.active_tool|default(-1)|int %}
    {% set n = printer["gcode_macro _FIL_PROMPT"].tool_count|int %}
    {% set presets = printer["gcode_macro LOAD_FILAMENT"].filament_presets %}
    {% set title = "Load filament" if mode == "LOAD" else "Unload filament" %}

    RESPOND TYPE=command MSG="action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_begin {title}"
    {% if t < 0 %}
        # Step 1: tool
        RESPOND TYPE=command MSG="action:prompt_text Choose the tool."
        {% for i in range(n) %}
            {% if mode == "LOAD" %}
                {% set next = ("LOAD_FILAMENT TOOL=%d TYPE=%s" % (i, type)) if type else ("_FIL_PROMPT MODE=LOAD TOOL=%d" % i) %}
            {% else %}
                {% set next = "UNLOAD_FILAMENT TOOL=%d" % i %}
            {% endif %}
            {% if i % 3 == 0 %}
                RESPOND TYPE=command MSG="action:prompt_button_group_start"
            {% endif %}
            RESPOND TYPE=command MSG="action:prompt_button T{i}|{next}|{'primary' if i == act else 'secondary'}"
            {% if i % 3 == 2 or loop.last %}
                RESPOND TYPE=command MSG="action:prompt_button_group_end"
            {% endif %}
        {% endfor %}
    {% else %}
        # Step 2 (load only): material
        RESPOND TYPE=command MSG="action:prompt_text T{t}: choose the material. The tool is picked up, heated over the bucket and loaded."
        {% for m in presets %}
            {% if loop.index0 % 4 == 0 %}
                RESPOND TYPE=command MSG="action:prompt_button_group_start"
            {% endif %}
            RESPOND TYPE=command MSG="action:prompt_button {m} ({presets[m]['temp']|int} C)|LOAD_FILAMENT TOOL={t} TYPE={m}|primary"
            {% if loop.index0 % 4 == 3 or loop.last %}
                RESPOND TYPE=command MSG="action:prompt_button_group_end"
            {% endif %}
        {% endfor %}
        RESPOND TYPE=command MSG="action:prompt_footer_button Back|_FIL_PROMPT MODE=LOAD|secondary"
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_FIL_PROMPT_CLOSE|error"
    RESPOND TYPE=command MSG="action:prompt_show"
    {% endif %}

[gcode_macro _FIL_PROMPT_CLOSE]
description: Inner - close the filament dialog
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"

#--------------------------------------------------------------------
#  Spool list from Spoolman (scripts/spool_picker/spool_picker.py)
#--------------------------------------------------------------------
[gcode_shell_command spool_picker]
command: bash /home/pi/printer_data/config/scripts/spool_picker/spool_picker_launch.sh
timeout: 5.
verbose: False

[gcode_macro _SPOOL_PICKER]
description: Inner - show the Spoolman spools as a dialog: TOOL=n [MATERIAL=x] [PAGE=n]
gcode:
    {% set t = params.TOOL|int %}
    {% set n = printer["gcode_macro _FIL_PROMPT"].tool_count|int %}
    {% set presets = printer["gcode_macro LOAD_FILAMENT"].filament_presets %}
    {% set temp = printer["gcode_macro _global_var"].load_filament_extruder_temp|default(250)|int %}
    # Spool IDs of all tools (same source as _ORCA_LANES), to mark spools in use
    {% set ns = namespace(a="") %}
    {% for i in range(n) %}
        {% set name = "gcode_macro T" ~ i %}
        {% set live = printer[name].spool_id if name in printer else none %}
        {% set sid = live|int(0) if live is not none else 0 %}
        {% set ns.a = ns.a ~ ("," if i else "") ~ i ~ "=" ~ sid %}
    {% endfor %}
    # Placeholder until the script answers (usually under a second)
    RESPOND TYPE=command MSG="action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_begin Load filament"
    RESPOND TYPE=command MSG="action:prompt_text Reading spools from Spoolman..."
    RESPOND TYPE=command MSG="action:prompt_footer_button Without spool|_FIL_PROMPT MODE=LOAD TOOL={t} PRESETS=1|secondary"
    RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_FIL_PROMPT_CLOSE|error"
    RESPOND TYPE=command MSG="action:prompt_show"
    RUN_SHELL_COMMAND CMD=spool_picker PARAMS="--tool={t} --assigned={ns.a} --presets={presets|join(',')} --temp={temp} --material={params.MATERIAL|default('')} --page={params.PAGE|default(0)|int}"
