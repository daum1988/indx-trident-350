#####################################################################
#  LC_EXTRUDE_TEST - does the INDX load cell see the extrusion pressure?
#####################################################################
#  Test only, changes nothing in the config or in stored values.
#  Usage: heat the tool, e.g.  M109 S210
#          LC_EXTRUDE_TEST SPEED=1
#          LC_EXTRUDE_TEST SPEED=3
#          LC_EXTRUDE_TEST SPEED=6
#  SPEED  = filament feed in mm/s (1 mm/s ~ 2.4 mm3/s at 1.75 mm)
#  LENGTH = extruded length in mm (default 40, max. 45)
#  SPEED=0 TIME=20 = idle measurement without extrusion (interference from the heater)
#  Wait for the result line before starting the next test.
#  Moves to the bucket, measures the force at rest and while
#  extruding and reports the difference. If the difference rises clearly
#  with speed, the load cell sees the nozzle pressure.
#####################################################################

[gcode_macro LC_EXTRUDE_TEST]
description: Test - measures the load cell force change while extruding. SPEED= mm/s, LENGTH= mm
variable_base: 0.0
variable_sum: 0.0
variable_n: 0
variable_fmin: 0.0
variable_fmax: 0.0
variable_left: 0
variable_speed: 0.0
gcode:
    {% set speed = params.SPEED|default(3)|float %}
    {% set length = params.LENGTH|default(40)|float %}
    {% if 'load_cell_probe' not in printer or printer.load_cell_probe.force_g is not defined %}
        {action_raise_error("Load Cell nicht verfuegbar oder nicht kalibriert.")}
    {% endif %}
    {% if printer.save_variables.variables.active_tool|default(-1)|int < 0 %}
        {action_raise_error("Kein Tool im Kopf.")}
    {% endif %}
    {% if printer.extruder.temperature < 180 %}
        {action_raise_error("Erst das Tool auf Drucktemperatur heizen, z.B. M109 S210.")}
    {% endif %}
    {% if length > 45 or length < 10 or speed < 0 %}
        {action_raise_error("LENGTH 10-45 mm, SPEED >= 0 (0 = Leerlauf-Messung).")}
    {% endif %}
    {% if speed > 0 and length / speed < 4 %}
        {action_raise_error("Zu kurz zum Messen: LENGTH/SPEED muss mindestens 4 s ergeben.")}
    {% endif %}
    UPDATE_DELAYED_GCODE ID=_lc_test_sample DURATION=0   ; evtl. laufende Messung beenden
    MOVE_TO_BUCKET
    M400
    G4 P2000                      ; let the force reading settle at rest
    _LC_TEST_START LENGTH={length} SPEED={speed} TIME={params.TIME|default(20)|float}

[gcode_macro _LC_TEST_START]
description: Inner - store baseline, start extrusion, start measuring loop
gcode:
    {% set length = params.LENGTH|float %}
    {% set speed = params.SPEED|float %}
    {% set dur = length / speed if speed > 0 else params.TIME|float %}
    # skip the first 2 s (pressure build-up), then measure every 0.5 s until shortly before the end
    {% set cnt = [1, ((dur - 2.5) / 0.5)|int]|max %}
    {% set f0 = printer.load_cell_probe.force_g|float %}
    SET_GCODE_VARIABLE MACRO=LC_EXTRUDE_TEST VARIABLE=base VALUE={f0}
    SET_GCODE_VARIABLE MACRO=LC_EXTRUDE_TEST VARIABLE=sum VALUE=0.0
    SET_GCODE_VARIABLE MACRO=LC_EXTRUDE_TEST VARIABLE=n VALUE=0
    SET_GCODE_VARIABLE MACRO=LC_EXTRUDE_TEST VARIABLE=fmin VALUE={f0}
    SET_GCODE_VARIABLE MACRO=LC_EXTRUDE_TEST VARIABLE=fmax VALUE={f0}
    SET_GCODE_VARIABLE MACRO=LC_EXTRUDE_TEST VARIABLE=left VALUE={cnt}
    SET_GCODE_VARIABLE MACRO=LC_EXTRUDE_TEST VARIABLE=speed VALUE={speed}
    M83
    {% if speed > 0 %}
        G1 E{length} F{speed * 60}
    {% endif %}
    # no M400 here: the measuring loop must run during the move
    UPDATE_DELAYED_GCODE ID=_lc_test_sample DURATION=2

[delayed_gcode _lc_test_sample]
gcode:
    {% set m = printer["gcode_macro LC_EXTRUDE_TEST"] %}
    {% set f = printer.load_cell_probe.force_g|float %}
    SET_GCODE_VARIABLE MACRO=LC_EXTRUDE_TEST VARIABLE=sum VALUE={m.sum + f}
    SET_GCODE_VARIABLE MACRO=LC_EXTRUDE_TEST VARIABLE=n VALUE={m.n + 1}
    SET_GCODE_VARIABLE MACRO=LC_EXTRUDE_TEST VARIABLE=fmin VALUE={[m.fmin, f]|min}
    SET_GCODE_VARIABLE MACRO=LC_EXTRUDE_TEST VARIABLE=fmax VALUE={[m.fmax, f]|max}
    {% if m.left > 1 %}
        SET_GCODE_VARIABLE MACRO=LC_EXTRUDE_TEST VARIABLE=left VALUE={m.left - 1}
        UPDATE_DELAYED_GCODE ID=_lc_test_sample DURATION=0.5
    {% else %}
        _LC_TEST_REPORT
    {% endif %}

[gcode_macro _LC_TEST_REPORT]
description: Inner - print result
gcode:
    {% set m = printer["gcode_macro LC_EXTRUDE_TEST"] %}
    {% set mean = m.sum / [m.n, 1]|max %}
    {% set flow = m.speed * 2.405 %}
    {action_respond_info("LC_EXTRUDE_TEST %.1f mm/s (~%.1f mm3/s): Stillstand %.0f g, beim Extrudieren %.0f g (min %.0f / max %.0f, %d Werte). Differenz %+.0f g"
        % (m.speed, flow, m.base, mean, m.fmin, m.fmax, m.n, mean - m.base))}
