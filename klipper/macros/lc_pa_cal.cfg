#####################################################################
#  Pressure-Advance-Kalibrierung mit der INDX-Load-Cell
#####################################################################
#  PA_CAL_LOADCELL TOOL=0 TEMP=230
#  PA_CAL_LOADCELL TOOLS=0,3,5 TEMP=230      mehrere Tools nacheinander
#  PA_CAL_LOADCELL TOOLS=ALL TEMP=230        alle Tools
#      Nimmt das Tool auf (falls noetig), heizt, waermt ein frisch
#      aufgeheiztes Tool 60 s durch (SOAK=), faehrt zum Bucket, wartet auf
#      einen ruhigen Nullpunkt und spuelt 12 mm mit 2 mm/s vor. Aus der Kraft
#      dabei waehlt es die Sprunghoehe so, dass die Kraft bei etwa der halben
#      Sitz-Vorspannung des Tools bleibt (hoechstens 1,5 <-> 4 mm/s), sonst
#      hebt der Duesendruck das Tool im Sitz an. Dann 4x hoch/runter
#      (zusammen hoechstens ca. 51 mm pro Tool, 1-2 Minuten). Aus den 7
#      Kraftspruengen wird die Druck-Zeitkonstante gefittet, sie ist der
#      PA-Wert. Ergebnis pro Tool in der Konsole. Unsichere Werte werden
#      angezeigt, aber nicht gespeichert.
#      SAVE=1 (Standard) speichert ihn als t<n>_pa in indx_vars.cfg (ueber
#      SAVE_VARIABLE, die Tool-Offsets bleiben unberuehrt) und setzt ihn fuer
#      das Tool, das am Ende im Kopf ist. SAVE=0 = nur anzeigen.
#      Ist dem Tool eine Spule zugeordnet (SET_TOOL_SPOOL) und der
#      Duesendurchmesser bekannt (SET_TOOL_NOZZLE), landet der Wert ausserdem
#      im Spoolman-Filament dieser Spule, je Duese ein eigenes Zusatzfeld
#      ("Pressure Advance 0.4er Duese" usw., vorhandene Felder
#      pressure_advance_d04, _d06, _d025 werden benutzt, fehlende angelegt).
#      SPOOLMAN=0 schaltet das ab.
#      Am Ende (auch nach Abbruch) wird die Heizung ausgeschaltet.
#      COOL=0 laesst das Tool heiss (z.B. wenn danach gedruckt wird).
#      TEMP weglassen geht nur, wenn das Tool schon im Kopf ist und heizt.
#      PA haengt vom Filament und der Temperatur ab: mit dem Filament und der
#      Temperatur messen, mit denen gedruckt wird.
#
#  SET_TOOL_NOZZLE TOOL=3 D=0.6   Duesendurchmesser des Tools hinterlegen
#                                (einmal pro Tool, nach jedem Duesenwechsel)
#  LC_PA_APPLY            setzt den gespeicherten PA-Wert des aktiven Tools
#  LC_PA_SHOW             listet die gespeicherten Werte aller Tools
#
#  LC_PA_RAW              nur Rohdaten (CSV) aufzeichnen, ohne Auswertung
#      Optional PA=0.035 und SEQ=1:5,4:3 (Filament-mm/s:Sekunden, 0 = Pause),
#      COOL=0 laesst das Tool danach heiss
#
#  Waehrend einer Messung keine anderen Befehle schicken. Alle Messdaten
#  landen in lc_pa_data/ (Mainsail: Config-Dateien). Fehler stehen in
#  lc_pa_data/last_run.log.
#
#  Benoetigt: scripts/lc_pa/lc_pa_capture.py und lc_pa_launch.sh im
#  Config-Ordner sowie gcode_shell_command (ist schon installiert).
#####################################################################

[gcode_shell_command lc_pa_capture]
command: bash /home/pi/printer_data/config/scripts/lc_pa/lc_pa_launch.sh
timeout: 10.
verbose: True

[gcode_macro _LC_PA_CHECK]
description: Inner - gemeinsame Vorbedingungen
gcode:
    {% if 'load_cell_probe' not in printer or printer.load_cell_probe.force_g is not defined %}
        {action_raise_error("Load Cell nicht verfuegbar oder nicht kalibriert.")}
    {% endif %}
    {% if printer.print_stats.state in ["printing", "paused"] %}
        {action_raise_error("Nicht waehrend eines Drucks.")}
    {% endif %}

[gcode_macro PA_CAL_LOADCELL]
description: PA pro Tool mit der Load Cell messen. TOOL=n oder TOOLS=0,1,2 bzw. TOOLS=ALL, TEMP=, SAVE=1, SPOOLMAN=1
gcode:
    _LC_PA_CHECK
    {% set count = printer["gcode_macro TOOL_POSITIONS"].tool_count|int %}
    {% set raw = params.TOOLS|default(params.TOOL|default(""))|string|upper|replace(" ", "") %}
    {% if raw == "" %}
        {action_raise_error("TOOL=n oder TOOLS=0,1,2 bzw. TOOLS=ALL angeben.")}
    {% endif %}
    {% if raw == "ALL" %}
        {% set tools = range(count)|list %}
    {% else %}
        {% set tools = [] %}
        {% for t in raw.split(",") %}
            {% if not t.isdigit() or t|int >= count %}
                {action_raise_error("Ungueltiges Tool '%s' (T0-T%d)." % (t, count - 1))}
            {% endif %}
            {% set _ = tools.append(t|int) %}
        {% endfor %}
    {% endif %}
    {% set act = printer.save_variables.variables.active_tool|default(-1)|int %}
    {% if 'TEMP' in params %}
        {% set temp = params.TEMP|float %}
    {% elif act == tools[0] and printer.extruder.target >= 180 %}
        {% set temp = printer.extruder.target %}
    {% else %}
        {action_raise_error("TEMP= angeben, z.B. TEMP=230 fuer PLA.")}
    {% endif %}
    {% if temp < 180 or temp > 320 %}
        {action_raise_error("TEMP muss zwischen 180 und 320 liegen.")}
    {% endif %}
    {% set save = params.SAVE|default(1)|int %}
    {% set cool = params.COOL|default(1)|int %}
    {% set soak = params.SOAK|default(60)|float %}
    {% set sm = params.SPOOLMAN|default(1)|int %}
    RESPOND MSG="PA_CAL_LOADCELL: T{tools|join(',T')} bei {temp|round(0)|int} C, ca. 1-2 Minuten pro Tool."
    RUN_SHELL_COMMAND CMD=lc_pa_capture PARAMS="--mode cal --tools {tools|join(',')} --temp {temp} --save {save} --cool {cool} --soak {soak} --spoolman {sm}"

[gcode_macro LC_PA_APPLY]
description: Setzt den mit PA_CAL_LOADCELL gespeicherten PA-Wert des aktiven Tools (oder TOOL=n)
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set t = params.TOOL|default(svv.active_tool|default(-1))|int %}
    {% if t < 0 %}
        {action_raise_error("Kein Tool im Kopf.")}
    {% endif %}
    {% set key = "t%d_pa" % t %}
    {% if key not in svv %}
        RESPOND TYPE=error MSG="LC_PA_APPLY: fuer T{t} ist noch kein PA gespeichert (PA_CAL_LOADCELL TOOL={t} TEMP=...)."
    {% else %}
        SET_PRESSURE_ADVANCE ADVANCE={svv[key]}
        RESPOND MSG="LC_PA_APPLY: T{t} PA {svv[key]} (gemessen bei {svv['t%d_pa_temp' % t]|default('?')} C)"
        {% set n_now = svv['t%d_nozzle' % t]|default(0)|float %}
        {% set n_cal = svv['t%d_pa_nozzle' % t]|default(0)|float %}
        {% if n_now > 0 and n_cal > 0 and (n_now - n_cal)|abs > 0.001 %}
            RESPOND TYPE=error MSG="LC_PA_APPLY: Wert wurde mit {n_cal} mm gemessen, T{t} hat jetzt {n_now} mm - neu messen."
        {% endif %}
    {% endif %}

[gcode_macro LC_PA_SHOW]
description: Zeigt die gespeicherten PA-Werte aller Tools
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set count = printer["gcode_macro TOOL_POSITIONS"].tool_count|int %}
    {% set ns = namespace(out=[]) %}
    {% for t in range(count) %}
        {% if ("t%d_pa" % t) in svv %}
            {% set ns.out = ns.out + ["T%d %.3f (%s C, %s mm)" % (t, svv["t%d_pa" % t]|float, svv["t%d_pa_temp" % t]|default("?"), svv["t%d_pa_nozzle" % t]|default("?"))] %}
        {% else %}
            {% set ns.out = ns.out + ["T%d - (%s mm)" % (t, svv["t%d_nozzle" % t]|default("?"))] %}
        {% endif %}
    {% endfor %}
    RESPOND MSG="LC_PA: {ns.out|join(', ')} | aktiv: {printer.extruder.pressure_advance}"

[gcode_macro SET_TOOL_NOZZLE]
description: Duesendurchmesser eines Tools hinterlegen, z.B. SET_TOOL_NOZZLE TOOL=3 D=0.6 (ohne D = anzeigen)
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set count = printer["gcode_macro TOOL_POSITIONS"].tool_count|int %}
    {% if 'TOOL' not in params %}
        {% set ns = namespace(out=[]) %}
        {% for t in range(count) %}
            {% set ns.out = ns.out + ["T%d %s" % (t, svv["t%d_nozzle" % t]|default("-"))] %}
        {% endfor %}
        RESPOND MSG="SET_TOOL_NOZZLE: {ns.out|join(', ')}"
    {% else %}
        {% set t = params.TOOL|int %}
        {% if t < 0 or t >= count %}
            {action_raise_error("TOOL muss zwischen 0 und %d liegen." % (count - 1))}
        {% endif %}
        {% if 'D' not in params %}
            RESPOND MSG="SET_TOOL_NOZZLE: T{t} Duese: {svv['t%d_nozzle' % t]|default('nicht hinterlegt')}"
        {% else %}
            {% set d = params.D|float %}
            {% if d < 0.1 or d > 1.5 %}
                {action_raise_error("D muss zwischen 0.1 und 1.5 mm liegen.")}
            {% endif %}
            SAVE_VARIABLE VARIABLE=t{t}_nozzle VALUE={d}
            RESPOND MSG="SET_TOOL_NOZZLE: T{t} Duese {d} mm gespeichert."
        {% endif %}
    {% endif %}

[gcode_macro LC_PA_RAW]
description: Nur Rohdaten - Load-Cell-Kraftverlauf bei Vorschubspruengen als CSV aufzeichnen
gcode:
    _LC_PA_CHECK
    {% set pa = params.PA|default(0)|float %}
    {% set seq = params.SEQ|default("") %}
    {% set tool = printer.save_variables.variables.active_tool|default(-1)|int %}
    {% if tool < 0 %}
        {action_raise_error("Kein Tool im Kopf. Erst ein Tool aufnehmen, z.B. T0.")}
    {% endif %}
    {% if printer.extruder.temperature < 180 %}
        {action_raise_error("Erst das Tool auf Drucktemperatur heizen, z.B. M109 S210.")}
    {% endif %}
    {% if pa < 0 or pa > 0.2 %}
        {action_raise_error("PA muss zwischen 0 und 0.2 liegen.")}
    {% endif %}
    {% set args = "--mode raw --pa %.4f --cool %d" % (pa, params.COOL|default(1)|int) %}
    {% if seq %}
        {% set args = args ~ " --seq " ~ seq %}
    {% endif %}
    RUN_SHELL_COMMAND CMD=lc_pa_capture PARAMS="{args}"
