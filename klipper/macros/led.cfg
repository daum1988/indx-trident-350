# All macros for hotend_rgb (Neopixel on the EBB36) were removed:
# nozzleled_on/off, SET_LED_COLOR, LED_IDLE, LED_PRINTING, LED_QGL,
# LED_BED_MESH, LED_STANDBY, LED_HOMING, LED_HEATING_NOZZLE, LED_HEATING_BED.
# The calls in macros/trident_macros.cfg were removed as well.

[gcode_macro mainled_on]
gcode:
    SET_LED LED=cool_white WHITE=1.00 SYNC=0 TRANSMIT=1
    SET_LED LED=warm_white WHITE=1.00 SYNC=0 TRANSMIT=1

[gcode_macro mainled_off]
gcode:
    SET_LED LED=cool_white WHITE=0.00 SYNC=0 TRANSMIT=1
    SET_LED LED=warm_white WHITE=0.00 SYNC=0 TRANSMIT=1

[delayed_gcode LED_OFF]
initial_duration: 0.3
gcode:
    SET_LED LED=cool_white WHITE=0.00 SYNC=0 TRANSMIT=1
    SET_LED LED=warm_white WHITE=0.00 SYNC=0 TRANSMIT=1

[gcode_macro UPDATE_PROGRESS_LED]
gcode:
    {% set progress = printer.display_status.progress %}
    {% set total_leds = 50 %}
    {% set lit_leds = (progress * total_leds) | round(0, 'floor') | int %}
    {% set brightness = 20.0 / 255.0 %}
    {% for i in range(1, total_leds + 1) %}
        {% set is_last = (i == total_leds) %}
        {% if i <= lit_leds %}
            SET_LED LED=progressbar RED=0.0 GREEN={brightness} BLUE=0.0 INDEX={i} TRANSMIT={1 if is_last else 0}
        {% else %}
            SET_LED LED=progressbar RED=0.0 GREEN=0.0 BLUE=0.0 INDEX={i} TRANSMIT={1 if is_last else 0}
        {% endif %}
    {% endfor %}

[delayed_gcode UPDATE_PROGRESS_LOOP]
initial_duration: 0
gcode:
    {% set state = printer.print_stats.state %}
    {% if state == "printing" %}
        UPDATE_PROGRESS_LED
        UPDATE_DELAYED_GCODE ID=UPDATE_PROGRESS_LOOP DURATION=2
    {% elif state == "paused" %}
        _PROGRESS_LED_PAUSE
        UPDATE_DELAYED_GCODE ID=UPDATE_PROGRESS_LOOP DURATION=2
    {% elif state == "error" %}
        _PROGRESS_LED_ERROR_BLINK
    {% else %}
        _PROGRESS_LED_OFF
    {% endif %}

[gcode_macro _PROGRESS_LED_OFF]
gcode:
    SET_LED LED=progressbar RED=0 GREEN=0 BLUE=0

[gcode_macro _PROGRESS_LED_PAUSE]
gcode:
    {% set brightness = 20.0 / 255.0 %}
    SET_LED LED=progressbar RED=0.0 GREEN=0.0 BLUE={brightness}

[gcode_macro _PROGRESS_LED_ERROR_BLINK]
variable_blink_on: 0
gcode:
    {% set brightness = 20.0 / 255.0 %}
    {% if not blink_on %}
        SET_LED LED=progressbar RED={brightness} GREEN=0.0 BLUE=0.0
        SET_GCODE_VARIABLE MACRO=_PROGRESS_LED_ERROR_BLINK VARIABLE=blink_on VALUE=1
    {% else %}
        SET_LED LED=progressbar RED=0.0 GREEN=0.0 BLUE=0.0
        SET_GCODE_VARIABLE MACRO=_PROGRESS_LED_ERROR_BLINK VARIABLE=blink_on VALUE=0
    {% endif %}
    {% if printer.print_stats.state == "error" %}
        UPDATE_DELAYED_GCODE ID=UPDATE_PROGRESS_LOOP DURATION=0.5
    {% endif %}
