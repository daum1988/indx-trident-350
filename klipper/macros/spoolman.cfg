#####################################################################
#  Spoolman - one spool per INDX tool (T0-T8)
#####################################################################
#  Each tool's spool ID is stored in save_variables (indx_vars.cfg)
#  as t<n>__spool_id. That is exactly the name the Mainsail
#  Spoolman dialog writes itself when [save_variables] exists.
#  So the Mainsail dialog and SET_TOOL_SPOOL use the same values.
#
#  At runtime printer["gcode_macro T<n>"].spool_id applies. On startup
#  it is filled from save_variables (RESTORE_SELECTED_SPOOLS).
#
#  Tool change flow: all writes to active_tool go
#  through _INDX_SET_ACTIVE_TOOL (indx-tc-macros.cfg). The override in
#  indx/indx_overrides.cfg then calls _SPOOL_SYNC:
#    Pickup T<n>  -> SET_ACTIVE_SPOOL ID=<spool of T<n>>
#    Park (-1)    -> CLEAR_ACTIVE_SPOOL
#  Moonraker always books usage to the currently active spool.
#
#  Usage:
#    SET_TOOL_SPOOL T=3 ID=12   assign spool 12 to T3
#    SET_TOOL_SPOOL T=3 ID=0    clear the assignment of T3
#    SHOW_TOOL_SPOOLS           show all assignments
#####################################################################

[gcode_macro SET_ACTIVE_SPOOL]
description: Set the active spool in Moonraker/Spoolman (ID=<spool_id>)
gcode:
  {% set id = params.ID|default("")|string %}
  {% if id|int(0) > 0 %}
    {action_call_remote_method(
       "spoolman_set_active_spool",
       spool_id=id|int
    )}
  {% else %}
    {action_respond_info("SET_ACTIVE_SPOOL: parameter ID missing or not a valid spool ID")}
  {% endif %}

[gcode_macro CLEAR_ACTIVE_SPOOL]
description: Clear the active spool in Moonraker/Spoolman
gcode:
  {action_call_remote_method(
    "spoolman_set_active_spool",
    spool_id=None
  )}

#--------------------------------------------------------------------
#  spool_id on the tool macros. Mainsail then shows the tools in the
#  Spoolman dialog ("Change Spool") and writes the selection there.
#  The sections are merged with those from indx/indx.cfg;
#  gcode and variable_active stay there.
#--------------------------------------------------------------------
[gcode_macro T0]
variable_spool_id: None
[gcode_macro T1]
variable_spool_id: None
[gcode_macro T2]
variable_spool_id: None
[gcode_macro T3]
variable_spool_id: None
[gcode_macro T4]
variable_spool_id: None
[gcode_macro T5]
variable_spool_id: None
[gcode_macro T6]
variable_spool_id: None
[gcode_macro T7]
variable_spool_id: None
[gcode_macro T8]
variable_spool_id: None

#--------------------------------------------------------------------
#  On startup, load the stored spools into the T macros.
#  Runs after 1 s, i.e. before INIT_STATE (5 s), which activates the
#  spool of the tool on the head via _INDX_SET_ACTIVE_TOOL.
#  Same name as in the Mainsail example, so there is only one version.
#--------------------------------------------------------------------
[delayed_gcode RESTORE_SELECTED_SPOOLS]
initial_duration: 1
gcode:
  {% set svv = printer.save_variables.variables %}
  {% for i in range(9) %}
    {% set macro = "T" ~ i %}
    {% set var = "t" ~ i ~ "__spool_id" %}
    {% if ("gcode_macro " ~ macro) in printer and var in svv %}
      {% set sid = svv[var]|int(0) %}
      SET_GCODE_VARIABLE MACRO={macro} VARIABLE=spool_id VALUE={sid if sid > 0 else "None"}
    {% endif %}
  {% endfor %}
  UPDATE_DELAYED_GCODE ID=_SPOOL_WATCH DURATION=10

#--------------------------------------------------------------------
#  Activate the spool for TOOL in Moonraker (TOOL=-1: none).
#  Called by _INDX_SET_ACTIVE_TOOL, i.e. on every pickup,
#  every park and on startup. Remembers the ID it set so that
#  _SPOOL_WATCH can detect changes made in the Mainsail dialog.
#--------------------------------------------------------------------
[gcode_macro _SPOOL_SYNC]
description: Inner - set the Spoolman spool matching the tool on the head
variable_last: -1
gcode:
  {% set t = params.TOOL|default(-1)|int %}
  {% set svv = printer.save_variables.variables %}
  {% set sid = 0 %}
  {% if t >= 0 %}
    {% set name = "gcode_macro T" ~ t %}
    {% set live = printer[name].spool_id if (name in printer and printer[name].spool_id is defined) else None %}
    # Runtime value first (Mainsail dialog), otherwise save_variables
    {% set sid = live|int(0) if live is not none else svv["t" ~ t ~ "__spool_id"]|default(0)|int(0) %}
  {% endif %}
  {% if sid > 0 %}
    SET_ACTIVE_SPOOL ID={sid}
    {% if printer["gcode_macro _SPOOL_SYNC"].last|int != sid %}
      RESPOND MSG="Spoolman: T{t} -> spool {sid}"
    {% endif %}
  {% else %}
    CLEAR_ACTIVE_SPOOL
    {% if t >= 0 %}
      RESPOND TYPE=error MSG="Spoolman: T{t} has no spool assigned, usage is not tracked (SET_TOOL_SPOOL T={t} ID=...)"
    {% endif %}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=_SPOOL_SYNC VARIABLE=last VALUE={sid}

#--------------------------------------------------------------------
#  If you pick a new spool in the Mainsail dialog for the tool that
#  is currently on the head, only the next tool change would notice.
#  This watcher checks every 3 s and syncs right away. It
#  only sends a command when something changed.
#--------------------------------------------------------------------
[delayed_gcode _SPOOL_WATCH]
gcode:
  {% set act = printer.save_variables.variables.active_tool|default(-1)|int %}
  {% if act >= 0 and ("gcode_macro T" ~ act) in printer %}
    {% set live = printer["gcode_macro T" ~ act].spool_id %}
    {% set sid = live|int(0) if live is not none else 0 %}
    {% if sid != printer["gcode_macro _SPOOL_SYNC"].last|int %}
      _SPOOL_SYNC TOOL={act}
    {% endif %}
  {% endif %}
  # Update the OrcaSlicer slots if the spool of any tool
  # has changed (also on the first run after startup)
  _ORCA_LANES
  UPDATE_DELAYED_GCODE ID=_SPOOL_WATCH DURATION=3

#--------------------------------------------------------------------
#  OrcaSlicer: the tools' spools as Moonraker lane_data
#--------------------------------------------------------------------
#  OrcaSlicer (printer agent Moonraker) reads the slots from lane_data
#  when syncing filaments: T0 = filament 1 ... T8 = filament 9.
#  scripts/orca_lanes/orca_lanes.py fetches material, colour and temperatures
#  of the spool from Spoolman and writes lane0..lane8. Runs in the background,
#  so it never blocks a print. Log: logs/orca_lanes.log
#
#  Runs automatically when an assignment changes (SET_TOOL_SPOOL,
#  Mainsail dialog, startup). After changing a spool in Spoolman
#  itself (e.g. corrected colour): ORCA_LANES_SYNC
#--------------------------------------------------------------------
[gcode_shell_command orca_lanes]
command: bash /home/pi/printer_data/config/scripts/orca_lanes/orca_lanes_launch.sh
timeout: 5.
verbose: False

[gcode_macro _ORCA_LANES]
description: Inner - write lane_data for OrcaSlicer when an assignment changed (FORCE=1: always)
variable_sig: ""
gcode:
  {% set n = printer["gcode_macro TOOL_POSITIONS"].tool_count|default(9)|int %}
  {% set ns = namespace(args="") %}
  {% for i in range(n) %}
    {% set name = "gcode_macro T" ~ i %}
    {% set live = printer[name].spool_id if name in printer else none %}
    {% set sid = live|int(0) if live is not none else 0 %}
    {% set ns.args = ns.args ~ (" " if i else "") ~ i ~ "=" ~ sid %}
  {% endfor %}
  {% if params.FORCE|default(0)|int or ns.args != printer["gcode_macro _ORCA_LANES"].sig %}
    SET_GCODE_VARIABLE MACRO=_ORCA_LANES VARIABLE=sig VALUE='"{ns.args}"'
    RUN_SHELL_COMMAND CMD=orca_lanes PARAMS="{ns.args}"
  {% endif %}

[gcode_macro ORCA_LANES_SYNC]
description: Resend the spools of all tools to OrcaSlicer (Moonraker lane_data)
gcode:
  _ORCA_LANES FORCE=1

#--------------------------------------------------------------------
#  Assign a spool to a tool (ID=0 clears the assignment)
#--------------------------------------------------------------------
[gcode_macro SET_TOOL_SPOOL]
description: Assign a Spoolman spool to a tool: SET_TOOL_SPOOL T=<0-8> ID=<spool_id> (ID=0 clears)
gcode:
  {% if params.T is not defined or params.ID is not defined %}
    RESPOND TYPE=error MSG="Usage: SET_TOOL_SPOOL T=<0-8> ID=<spool_id>   (ID=0 clears the assignment)"
  {% else %}
    {% set t = params.T|int %}
    {% set sid = params.ID|int(0) %}
    {% set n = printer["gcode_macro TOOL_POSITIONS"].tool_count|default(9)|int %}
    {% if t < 0 or t >= n %}
      RESPOND TYPE=error MSG="SET_TOOL_SPOOL: T{t} does not exist (0-{n - 1})"
    {% else %}
      {% if sid > 0 %}
        SAVE_VARIABLE VARIABLE=t{t}__spool_id VALUE={sid}
        SET_GCODE_VARIABLE MACRO=T{t} VARIABLE=spool_id VALUE={sid}
        RESPOND MSG="Spoolman: spool {sid} assigned to T{t}"
      {% else %}
        SAVE_VARIABLE VARIABLE=t{t}__spool_id VALUE=None
        SET_GCODE_VARIABLE MACRO=T{t} VARIABLE=spool_id VALUE=None
        RESPOND MSG="Spoolman: spool assignment of T{t} cleared"
      {% endif %}
      # If the tool is on the head right now, switch immediately. _SPOOL_SYNC
      # evaluates its template only when called and sees the new ID.
      {% if printer.save_variables.variables.active_tool|default(-1)|int == t %}
        _SPOOL_SYNC TOOL={t}
      {% endif %}
    {% endif %}
  {% endif %}

[gcode_macro SHOW_TOOL_SPOOLS]
description: Show the Spoolman assignment of all tools
gcode:
  {% set act = printer.save_variables.variables.active_tool|default(-1)|int %}
  {% set n = printer["gcode_macro TOOL_POSITIONS"].tool_count|default(9)|int %}
  # One single message like SHOW_TOOL_FILAMENT. Single lines starting
  # with "T0:" are hidden by Mainsail as temperature reports.
  {% set out = ["Spoolman assignment:"] %}
  {% for i in range(n) %}
    {% set live = printer["gcode_macro T" ~ i].spool_id %}
    {% set sid = live|int(0) if live is not none else 0 %}
    {% set _ = out.append("T%d = %s%s" % (i, ("spool %d" % sid) if sid > 0 else "no spool", " (active)" if i == act else "")) %}
  {% endfor %}
  {action_respond_info(out|join("\n"))}
