#####################################################################
#  Spoolman - eine Spule pro INDX-Tool (T0-T8)
#####################################################################
#  Die Spool-ID jedes Tools steht in save_variables (indx_vars.cfg)
#  unter t<n>__spool_id. Das ist genau der Name, den der Mainsail-
#  Spoolman-Dialog selbst schreibt, wenn [save_variables] vorhanden ist.
#  Mainsail-Dialog und SET_TOOL_SPOOL benutzen also dieselben Werte.
#
#  Zur Laufzeit gilt printer["gcode_macro T<n>"].spool_id. Beim Start
#  wird das aus save_variables gefuellt (RESTORE_SELECTED_SPOOLS).
#
#  Ablauf beim Toolwechsel: Alle Schreibzugriffe auf active_tool laufen
#  ueber _INDX_SET_ACTIVE_TOOL (indx-tc-macros.cfg). Der Override in
#  indx/indx_overrides.cfg ruft danach _SPOOL_SYNC auf:
#    Pickup T<n>  -> SET_ACTIVE_SPOOL ID=<Spule von T<n>>
#    Parken (-1)  -> CLEAR_ACTIVE_SPOOL
#  Moonraker bucht den Verbrauch immer auf die gerade aktive Spule.
#
#  Benutzen:
#    SET_TOOL_SPOOL T=3 ID=12   Spule 12 an T3 zuweisen
#    SET_TOOL_SPOOL T=3 ID=0    Zuweisung von T3 loeschen
#    SHOW_TOOL_SPOOLS           alle Zuweisungen anzeigen
#####################################################################

[gcode_macro SET_ACTIVE_SPOOL]
description: Aktive Spule in Moonraker/Spoolman setzen (ID=<spool_id>)
gcode:
  {% set id = params.ID|default("")|string %}
  {% if id|int(0) > 0 %}
    {action_call_remote_method(
       "spoolman_set_active_spool",
       spool_id=id|int
    )}
  {% else %}
    {action_respond_info("SET_ACTIVE_SPOOL: Parameter ID fehlt oder ist keine gueltige Spool-ID")}
  {% endif %}

[gcode_macro CLEAR_ACTIVE_SPOOL]
description: Aktive Spule in Moonraker/Spoolman loeschen
gcode:
  {action_call_remote_method(
    "spoolman_set_active_spool",
    spool_id=None
  )}

#--------------------------------------------------------------------
#  spool_id an den Tool-Makros. Mainsail zeigt die Tools dann im
#  Spoolman-Dialog ("Change Spool") und schreibt die Auswahl dorthin.
#  Die Sektionen werden mit denen aus indx/indx.cfg zusammengefuehrt;
#  gcode und variable_active bleiben dort.
#--------------------------------------------------------------------
[gcode_macro T0]
variable_spool_id: None
[gcode_macro T1]
variable_spool_id: None
[gcode_macro T2]
variable_spool_id: None
[gcode_macro T3]
variable_spool_id: None
[gcode_macro T4]
variable_spool_id: None
[gcode_macro T5]
variable_spool_id: None
[gcode_macro T6]
variable_spool_id: None
[gcode_macro T7]
variable_spool_id: None
[gcode_macro T8]
variable_spool_id: None

#--------------------------------------------------------------------
#  Beim Start die gespeicherten Spulen in die T-Makros laden.
#  Laeuft nach 1 s, also vor INIT_STATE (5 s), das ueber
#  _INDX_SET_ACTIVE_TOOL die Spule des Tools auf dem Kopf aktiviert.
#  Gleicher Name wie im Mainsail-Beispiel, damit es nur eine Version gibt.
#--------------------------------------------------------------------
[delayed_gcode RESTORE_SELECTED_SPOOLS]
initial_duration: 1
gcode:
  {% set svv = printer.save_variables.variables %}
  {% for i in range(9) %}
    {% set macro = "T" ~ i %}
    {% set var = "t" ~ i ~ "__spool_id" %}
    {% if ("gcode_macro " ~ macro) in printer and var in svv %}
      {% set sid = svv[var]|int(0) %}
      SET_GCODE_VARIABLE MACRO={macro} VARIABLE=spool_id VALUE={sid if sid > 0 else "None"}
    {% endif %}
  {% endfor %}
  UPDATE_DELAYED_GCODE ID=_SPOOL_WATCH DURATION=10

#--------------------------------------------------------------------
#  Spule fuer TOOL in Moonraker aktivieren (TOOL=-1: keine).
#  Wird von _INDX_SET_ACTIVE_TOOL aufgerufen, also bei jedem Pickup,
#  jedem Parken und beim Start. Merkt sich die gesetzte ID, damit
#  _SPOOL_WATCH Aenderungen aus dem Mainsail-Dialog erkennt.
#--------------------------------------------------------------------
[gcode_macro _SPOOL_SYNC]
description: Inner - Spoolman-Spule passend zum Tool auf dem Kopf setzen
variable_last: -1
gcode:
  {% set t = params.TOOL|default(-1)|int %}
  {% set svv = printer.save_variables.variables %}
  {% set sid = 0 %}
  {% if t >= 0 %}
    {% set name = "gcode_macro T" ~ t %}
    {% set live = printer[name].spool_id if (name in printer and printer[name].spool_id is defined) else None %}
    # Laufzeitwert zuerst (Mainsail-Dialog), sonst save_variables
    {% set sid = live|int(0) if live is not none else svv["t" ~ t ~ "__spool_id"]|default(0)|int(0) %}
  {% endif %}
  {% if sid > 0 %}
    SET_ACTIVE_SPOOL ID={sid}
    {% if printer["gcode_macro _SPOOL_SYNC"].last|int != sid %}
      RESPOND MSG="Spoolman: T{t} -> Spule {sid}"
    {% endif %}
  {% else %}
    CLEAR_ACTIVE_SPOOL
    {% if t >= 0 %}
      RESPOND TYPE=error MSG="Spoolman: T{t} hat keine Spule zugewiesen, Verbrauch wird nicht gebucht (SET_TOOL_SPOOL T={t} ID=...)"
    {% endif %}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=_SPOOL_SYNC VARIABLE=last VALUE={sid}

#--------------------------------------------------------------------
#  Waehlt man im Mainsail-Dialog eine neue Spule fuer das Tool, das
#  gerade auf dem Kopf sitzt, merkt das erst der naechste Toolwechsel.
#  Dieser Waechter prueft alle 3 s und gleicht dann sofort ab. Er
#  sendet nur bei einer Aenderung einen Befehl.
#--------------------------------------------------------------------
[delayed_gcode _SPOOL_WATCH]
gcode:
  {% set act = printer.save_variables.variables.active_tool|default(-1)|int %}
  {% if act >= 0 and ("gcode_macro T" ~ act) in printer %}
    {% set live = printer["gcode_macro T" ~ act].spool_id %}
    {% set sid = live|int(0) if live is not none else 0 %}
    {% if sid != printer["gcode_macro _SPOOL_SYNC"].last|int %}
      _SPOOL_SYNC TOOL={act}
    {% endif %}
  {% endif %}
  # OrcaSlicer-Steckplaetze nachziehen, falls sich bei irgendeinem Tool die
  # Spule geaendert hat (auch beim ersten Lauf nach dem Start)
  _ORCA_LANES
  UPDATE_DELAYED_GCODE ID=_SPOOL_WATCH DURATION=3

#--------------------------------------------------------------------
#  OrcaSlicer: Spulen der Tools als Moonraker lane_data
#--------------------------------------------------------------------
#  OrcaSlicer (Druckeragent Moonraker) liest beim Filamentabgleich die
#  Steckplaetze aus lane_data: T0 = Filament 1 ... T8 = Filament 9.
#  scripts/orca_lanes/orca_lanes.py holt Material, Farbe und Temperaturen
#  der Spule aus Spoolman und schreibt lane0..lane8. Laeuft im Hintergrund,
#  blockiert also keinen Druck. Log: logs/orca_lanes.log
#
#  Automatisch, wenn sich eine Zuweisung aendert (SET_TOOL_SPOOL,
#  Mainsail-Dialog, Start). Nach Aenderungen an einer Spule in Spoolman
#  selbst (z.B. Farbe korrigiert): ORCA_LANES_SYNC
#--------------------------------------------------------------------
[gcode_shell_command orca_lanes]
command: bash /home/pi/printer_data/config/scripts/orca_lanes/orca_lanes_launch.sh
timeout: 5.
verbose: False

[gcode_macro _ORCA_LANES]
description: Inner - lane_data fuer OrcaSlicer schreiben, wenn sich eine Zuweisung geaendert hat (FORCE=1: immer)
variable_sig: ""
gcode:
  {% set n = printer["gcode_macro TOOL_POSITIONS"].tool_count|default(9)|int %}
  {% set ns = namespace(args="") %}
  {% for i in range(n) %}
    {% set name = "gcode_macro T" ~ i %}
    {% set live = printer[name].spool_id if name in printer else none %}
    {% set sid = live|int(0) if live is not none else 0 %}
    {% set ns.args = ns.args ~ (" " if i else "") ~ i ~ "=" ~ sid %}
  {% endfor %}
  {% if params.FORCE|default(0)|int or ns.args != printer["gcode_macro _ORCA_LANES"].sig %}
    SET_GCODE_VARIABLE MACRO=_ORCA_LANES VARIABLE=sig VALUE='"{ns.args}"'
    RUN_SHELL_COMMAND CMD=orca_lanes PARAMS="{ns.args}"
  {% endif %}

[gcode_macro ORCA_LANES_SYNC]
description: Spulen aller Tools neu an OrcaSlicer (Moonraker lane_data) uebertragen
gcode:
  _ORCA_LANES FORCE=1

#--------------------------------------------------------------------
#  Einem Tool eine Spule zuweisen (ID=0 loescht die Zuweisung)
#--------------------------------------------------------------------
[gcode_macro SET_TOOL_SPOOL]
description: Spoolman-Spule einem Tool zuweisen: SET_TOOL_SPOOL T=<0-8> ID=<spool_id> (ID=0 loescht)
gcode:
  {% if params.T is not defined or params.ID is not defined %}
    RESPOND TYPE=error MSG="Aufruf: SET_TOOL_SPOOL T=<0-8> ID=<spool_id>   (ID=0 loescht die Zuweisung)"
  {% else %}
    {% set t = params.T|int %}
    {% set sid = params.ID|int(0) %}
    {% set n = printer["gcode_macro TOOL_POSITIONS"].tool_count|default(9)|int %}
    {% if t < 0 or t >= n %}
      RESPOND TYPE=error MSG="SET_TOOL_SPOOL: T{t} gibt es nicht (0-{n - 1})"
    {% else %}
      {% if sid > 0 %}
        SAVE_VARIABLE VARIABLE=t{t}__spool_id VALUE={sid}
        SET_GCODE_VARIABLE MACRO=T{t} VARIABLE=spool_id VALUE={sid}
        RESPOND MSG="Spoolman: Spule {sid} an T{t} zugewiesen"
      {% else %}
        SAVE_VARIABLE VARIABLE=t{t}__spool_id VALUE=None
        SET_GCODE_VARIABLE MACRO=T{t} VARIABLE=spool_id VALUE=None
        RESPOND MSG="Spoolman: Spulenzuweisung von T{t} geloescht"
      {% endif %}
      # Sitzt das Tool gerade auf dem Kopf, sofort umschalten. _SPOOL_SYNC
      # wertet sein Template erst beim Aufruf aus und sieht die neue ID.
      {% if printer.save_variables.variables.active_tool|default(-1)|int == t %}
        _SPOOL_SYNC TOOL={t}
      {% endif %}
    {% endif %}
  {% endif %}

[gcode_macro SHOW_TOOL_SPOOLS]
description: Spoolman-Zuweisung aller Tools anzeigen
gcode:
  {% set act = printer.save_variables.variables.active_tool|default(-1)|int %}
  {% set n = printer["gcode_macro TOOL_POSITIONS"].tool_count|default(9)|int %}
  # Eine einzige Meldung wie bei SHOW_TOOL_FILAMENT. Einzelne Zeilen, die
  # mit "T0:" beginnen, blendet Mainsail als Temperaturmeldung aus.
  {% set out = ["Spoolman-Zuweisung:"] %}
  {% for i in range(n) %}
    {% set live = printer["gcode_macro T" ~ i].spool_id %}
    {% set sid = live|int(0) if live is not none else 0 %}
    {% set _ = out.append("T%d = %s%s" % (i, ("Spule %d" % sid) if sid > 0 else "keine Spule", " (aktiv)" if i == act else "")) %}
  {% endfor %}
  {action_respond_info(out|join("\n"))}
