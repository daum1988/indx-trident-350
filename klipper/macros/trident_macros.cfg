#####################################################################
# 	Macros
#####################################################################

[gcode_macro _global_var]
# Park position rear centre, away from the docks at the front. Used for
# PAUSE, CANCEL_PRINT and END_PRINT via the _PARK_HEAD macro.
#   park_x = -1: centre between position_min and position_max of X
#   park_y = -1: position_max of Y minus park_margin_y
#   A number instead of -1 sets a fixed position.
variable_park_x: -1
variable_park_y: -1
variable_park_margin_y: 5
# x/y here are no longer used, only e (retract on pause)
variable_pause_park:{'x': 175, 'y': 380, 'z': 50, 'e': 1}
variable_cancel_park:{'x': 175, 'y': 380, 'z': 10, 'e': 1}
# Distance (mm) to position_max of [stepper_z] that is never reached.
# Buffer for Z_TILT corrections and bed mesh compensation. Replaces the old
# fixed z_maximum_lifting_distance (295 was even above position_max 294).
# 15 instead of 5: on the next G28 _INDX_SAFE_Z_HOP blindly moves 10 mm
# (probe_z_clearance) + 1 mm tool z_hop down, that still has to fit.
# With switch [gcode_button z_low] (indx_overrides.cfg) this can go down to 3.
variable_z_park_margin: 15
variable_pause_resume_travel_speed: 150
variable_bed_mesh_calibrate_target_temp: 65
variable_load_filament_extruder_temp: 250
variable_heat_soak_time: 0 # in minutes
gcode:

# Start Print and Eddy NG Macros from:
  # https://www.printables.com/model/1269473-btt-eddy-ng-macro-my-print-start-on-my-sv08/files
  # https://github.com/ThePrintasaurus/SV08-Eddy-NG/blob/main/adaptive_purge.cfg
  # https://github.com/vvuk/eddy-ng/wiki
# Adapted for INDX: Z tilt and Z homing with the load cell,
# bed mesh with the eddy scanner in the Smart Head (config/bed_mesh.cfg).

[gcode_macro _ENSURE_HOMED]
description: Homes X/Y/Z only if the toolhead isn't already homed
gcode:
    {% if printer.toolhead.homed_axes|lower != "xyz" %}
        M117 Homing...
        G28
    {% endif %}

[gcode_macro G32]
gcode:
    BED_MESH_CLEAR
    G28
    Z_TILT_ADJUST
    G28

    G0 X175 Y175 Z30 F3600


[gcode_macro START_PRINT]
#   Use PRINT_START for the slicer starting script - please customise for your slicer of choice
#
#   Recommended slicer call (pass temperatures and first tool):
#     START_PRINT EXTRUDER=[first_layer_temperature[initial_tool]] BED=[first_layer_bed_temperature] TOOL=[initial_tool]
#   Without parameters the current target temperatures are used. Note:
#   INDX ignores M104/M109 while no tool is on the head, so
#   the nozzle temperature is often still 0 before the first G28.
description: Homing, Z tilt (load cell), bed mesh (scanner), heat up
variable_state: 'Prepare'
variable_record_extruder_temp: 0
variable_max_record_extruder_temp: 0

gcode:
    {% set extruder_target_temp = params.EXTRUDER|default(printer.extruder.target)|int %}
    {% set bed_targer_temp = params.BED|default(printer.heater_bed.target)|int %}
    {% set tool = params.TOOL|default(-1)|int %}

    M400
    CLEAR_PAUSE
    G90
    MAINLED_ON

    {% if state == 'Prepare' %}
        {action_respond_info("Prepare!")}

        ; Homing: G28 Z fetches T0 from the dock and probes with the load cell
        {% set needs_homing = printer.toolhead.homed_axes|lower != "xyz" %}
        _ENSURE_HOMED
        {% if needs_homing %}
            G0 X175 Y175 Z30 F3600
        {% endif %}

        {action_respond_info("Check Heating!")}

        M140 S{bed_targer_temp}

        {% if printer.heater_bed.temperature < bed_targer_temp %}
            M117 Bed heating...
            {action_respond_info("Bed heating...")}
            M190 S{bed_targer_temp}
        {% endif %}

        ; Bring the nozzle to probing temperature and clean it,
        ; so no filament distorts the load cell measurement
        M117 Nozzle cleaning...
        M109 S150
        clean_nozzle

        ; Z tilt and Z homing with the load cell (nozzle = probe point)
        M117 Z-Tilt Adjust...
        Z_TILT_ADJUST
        G28 Z
        G0 X175 Y175 Z30 F3600

        ; Bed mesh with the eddy scanner. Heater off, because the
        ; induction heater disturbs the scanner measurement.
        M104 S0
        M117 Meshing Bed...
        BED_MESH_CALIBRATE PROBE=scanner METHOD=rapid_scan ADAPTIVE=1

        ; Fetch the first tool from the slicer (G28 picked up T0).
        ; No comparison with active_tool here: the template is evaluated before
        ; the G28. CHANGE_TOOL checks the real state itself.
        {% if tool >= 0 %}
            M117 Tool change T{tool}...
            T{tool}
        {% endif %}

        ; Heat up to printing temperature
        {% if extruder_target_temp > 0 %}
            M117 Nozzle heating...
            {action_respond_info("Nozzle heating...")}
            M109 S{extruder_target_temp}
        {% endif %}

        SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=state VALUE='"Start"'
        UPDATE_DELAYED_GCODE ID=_print_start_wait DURATION=0.5

        ; Park Head near print area
        G0 X175 Y175 Z30 F3600

        SET_FAN_SPEED FAN=BedFans SPEED=0.9

    {% elif state == 'Start' %}
        UPDATE_DELAYED_GCODE ID=UPDATE_PROGRESS_LOOP DURATION=1
        M117 Printing now!!!
        {action_respond_info("Start!")}
    {% endif %}


[gcode_macro END_PRINT]
#   Use PRINT_END for the slicer ending script - please customise for your slicer of choice
gcode:
    SAVE_GCODE_STATE NAME=STATE_PRINT_END

    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-10.0 F3600                ; retract filament
    _Z_RAISE DIST=1                ; limited to position_max - z_park_margin
    G91                            ; relative positioning
    G0 X20.0 Y20.0 F20000          ; move nozzle to remove stringing
    G90                            ; absolute positioning
    TURN_OFF_HEATERS
    M107                           ; turn off fan
    _Z_RAISE DIST=2
    _PARK_HEAD F=3600              ; rear centre
    BED_MESH_CLEAR
    _PARK_BED_DOWN                 ; bed all the way down, docks are clear
    M84

    MAINLED_OFF
    UPDATE_DELAYED_GCODE ID=UPDATE_PROGRESS_LOOP DURATION=0
    _PROGRESS_LED_OFF

    # Fix: reset the state of the START_PRINT state machine, otherwise
    # the next print skips the 'Prepare' block (incl. homing),
    # because state is still 'Start' from the last print.
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=state VALUE='"Prepare"'
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=record_extruder_temp VALUE=0
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=max_record_extruder_temp VALUE=0

    # The purpose of the SAVE_GCODE_STATE/RESTORE_GCODE_STATE
    # command pair is to restore the printer's coordinate system
    # and speed settings since the commands above change them.
    # However, to prevent any accidental, unintentional toolhead
    # moves when restoring the state, explicitly set MOVE=0.
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END MOVE=0

    CLEAR_PAUSE

[gcode_macro _Z_RAISE]
description: Raises Z relatively by DIST, but never beyond position_max - z_park_margin
gcode:
    {% set dist = params.DIST|default(5)|float %}
    {% set margin = printer['gcode_macro _global_var'].z_park_margin|float %}
    {% set z_limit = printer.toolhead.axis_maximum.z - margin %}
    {% set z_now = printer.toolhead.position.z %}
    {% set step = [dist, z_limit - z_now]|min %}
    {% if 'z' in printer.toolhead.homed_axes and step > 0 %}
        G91
        G1 Z{step} F3000
        G90
    {% endif %}

[gcode_macro _PARK_HEAD]
description: Moves the head to the park position (default: rear centre, from the axis limits)
gcode:
    {% set gv = printer['gcode_macro _global_var'] %}
    {% set th = printer.toolhead %}
    {% set f = params.F|default(6000)|float %}
    {% set x = gv.park_x|float %}
    {% set y = gv.park_y|float %}
    {% if x < 0 %}
        {% set x = (th.axis_minimum.x + th.axis_maximum.x) / 2 %}
    {% endif %}
    {% if y < 0 %}
        {% set y = th.axis_maximum.y - gv.park_margin_y|float %}
    {% endif %}
    {% if 'xy' in th.homed_axes %}
        # Axis limits are machine coordinates, G1 works with the G-code offset
        # (z.B. Tool-Offsets von INDX), deshalb homing_origin abziehen.
        {% set o = printer.gcode_move.homing_origin %}
        G90
        G1 X{x - o.x} Y{y - o.y} F{f}
    {% endif %}

[gcode_macro _PARK_BED_DOWN]
description: Moves the bed to position_max - z_park_margin (all the way down)
gcode:
    {% set margin = printer['gcode_macro _global_var'].z_park_margin|float %}
    {% set z_target = printer.toolhead.axis_maximum.z - margin %}
    {% if 'z' in printer.toolhead.homed_axes and printer.toolhead.position.z < z_target %}
        # G1 works in G-code coordinates, toolhead.position without offset
        G90
        G1 Z{z_target - printer.gcode_move.homing_origin.z} F1200
        M400
    {% endif %}

[gcode_macro _IDLE_TIMEOUT]
description: Called by [idle_timeout] after 600 s without activity
gcode:
    TURN_OFF_HEATERS
    M107
    M84
    MAINLED_OFF
    _PROGRESS_LED_OFF
    RESPOND MSG="Idle timeout: heaters and motors off."

[gcode_macro _ALL_FAN_OFF]
gcode:
    M106 S0
    M107

[delayed_gcode bed_mesh_init]
initial_duration: .01
gcode:
    {% if "default" in printer.bed_mesh.profiles %}
        BED_MESH_PROFILE LOAD=default
    {% endif %}

[delayed_gcode _print_start_wait]
gcode:
    {% if printer['gcode_macro START_PRINT'].state == 'Heating'%}
        {action_respond_info("Prepare->Heating!")}
    {% elif printer['gcode_macro START_PRINT'].state == 'Start' %}
        {action_respond_info("Heating->Start!")}
    {% endif %}

    {% if printer['gcode_macro START_PRINT'].execute|lower != 'false' %}
        START_PRINT
    {% endif %}


[gcode_macro CANCEL_PRINT]
description:
rename_existing: CANCEL_PRINT_BASE
gcode:
    {% set z_park = printer['gcode_macro _global_var'].cancel_park.z|float %}

    CANCEL_PRINT_BASE

    M117 Cancel Print!!!
    # Filament sensor retract removed (no sensor fitted anymore)

    _Z_RAISE DIST=10
    G90
    _PARK_HEAD F=9000

    TURN_OFF_HEATERS
    _ALL_FAN_OFF
    MAINLED_OFF
    UPDATE_DELAYED_GCODE ID=UPDATE_PROGRESS_LOOP DURATION=0
    _PROGRESS_LED_OFF

    BED_MESH_CLEAR
    _PARK_BED_DOWN                 ; bed all the way down, like END_PRINT

    CLEAR_PAUSE
    M84 X Y Z E

    M117 Ready
    {action_respond_info("Cancel Print Success!")}
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=state VALUE='"Prepare"'
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=record_extruder_temp VALUE=0
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=max_record_extruder_temp VALUE=0


[gcode_macro PAUSE]
rename_existing: PAUSE_BASE
variable_state: 'normal'
gcode:
    {% if printer.pause_resume.is_paused == False %}
        {% set e_restract = printer['gcode_macro _global_var'].pause_park.e|float %}

        {% set state = params.STATE if 'filament_change' in params.STATE else 'normal' %}

        {action_respond_info("Pause Print!")}

        PAUSE_BASE
        M117 Pause Print!!!
        _Z_RAISE DIST=5
        G90
        _PARK_HEAD F={printer["gcode_macro _global_var"].pause_resume_travel_speed * 60}

        M104 S{printer.extruder.target}

        # state 'normal': filament sensor logic removed (no sensor fitted anymore)
        {% if state == 'filament_change' %}
            {% if (printer.extruder.temperature + 5 >= printer.extruder.target) and (printer.extruder.temperature >= printer.configfile.settings['extruder'].min_extrude_temp) %}
                G91
                G1 E+25 F300
                G1 E-10 F1500
                G1 E-20 F600
                M400
                G4 P3000
                # in two parts: with flow >100% (M221) -50 mm would exceed max_extrude_only_distance (50)
                G1 E-25 F300
                G1 E-25 F300
                G90
            {% endif %}
        {% endif %}
    {% endif %}


[delayed_gcode _resume_wait]
gcode:
    {% if printer['gcode_macro RESUME'].execute|lower != 'false' %}
        RESUME
    {% endif %}


[gcode_macro RESUME]
description: Pause the actual running print
rename_existing: RESUME_BASE
variable_state: 'normal'
gcode:
    {% set e_restract = printer['gcode_macro _global_var'].pause_park.e|float %}
    {% set extruder_target_temp = printer.extruder.target|int %}

    {% set state = params.STATE if 'filament_change' in params.STATE else 'normal' %}

    {% if state == 'filament_change' %}
        {% if printer.extruder.temperature + 5 >= printer.extruder.target %}
            G91
            G1 E30 F300
            G1 E10 F150
            G90
        {% else %}
            M104 S{extruder_target_temp}
            {action_respond_info("Nozzle not hot enough!")}
            {action_respond_info("Nozzle heating...")}
            M109 S{extruder_target_temp}
            G91
            G1 E30 F300
            G1 E10 F150
            G90
        {% endif %}
        {action_respond_info("Print resuming!")}
        RESUME_BASE
    {% elif state == 'normal' %}
        {action_respond_info("Print resuming!")}
        G91
        G1 E{e_restract} F300
        G90
        M117 Printing now!!!
        RESUME_BASE
    {% endif %}


# LOAD_FILAMENT: see indx/indx-cal.cfg and indx_overrides.cfg (with bucket)

[gcode_macro UNLOAD_FILAMENT]
gcode:
    {% set extruder_temp = printer['gcode_macro _global_var'].load_filament_extruder_temp|int %}
    {% set current_target_temp  = printer.extruder.target|int %}

    {% if printer.print_stats.state != "printing" %}
        {% if printer.print_stats.state != "paused" %}
            M104 S{extruder_temp}
            M117 Nozzle heating...
            {action_respond_info("Nozzle not hot enough!")}
            {action_respond_info("Nozzle heating...")}
            M109 S{extruder_temp}
        {% else %}
            {% if printer.extruder.target == 0 %}
                M104 S{extruder_temp}
                M117 Nozzle heating...
                {action_respond_info("Nozzle not hot enough!")}
                {action_respond_info("Nozzle heating...")}
                M109 S{extruder_temp}
            {% else %}
                M104 S{printer.extruder.target}
                M117 Nozzle heating...
                {action_respond_info("Nozzle not hot enough!")}
                {action_respond_info("Nozzle heating...")}
                M109 S{printer.extruder.target}
            {% endif %}
        {% endif %}
        MOVE_TO_BUCKET
        M117 Retracting...
        G91
        G1 E+25 F300
        G1 E-10 F1500
        G1 E-20 F600
        M400
        G4 P3000
        # in two parts: with flow >100% (M221) -50 mm would exceed max_extrude_only_distance (50)
        G1 E-25 F300
        G1 E-25 F300
        G90
        M400
        M117 Retract Finish
        M400
        # Spoolman: filament is out, clear the tool's spool assignment
        {% set act = printer.save_variables.variables.active_tool|default(-1)|int %}
        {% if act >= 0 and "gcode_macro SET_TOOL_SPOOL" in printer %}
            SET_TOOL_SPOOL T={act} ID=0
        {% endif %}
        # Wipe off strands/drips while the nozzle is still hot (like LOAD_FILAMENT)
        clean_nozzle
        # Then cool down. When the print is paused the nozzle stays hot so it can continue.
        {% if current_target_temp == 0 or printer.print_stats.state != "paused"%}
            M104 S0
            M117 Nozzle cooling down
            RESPOND MSG="UNLOAD_FILAMENT: done, nozzle cleaned, heater off"
        {% endif %}
    {% else %}
        {action_respond_info("Don't unload filament during printing!!!")}
    {% endif %}
