# Add these to your KlipperScreen.conf (above the auto-generated block).

[main]
# Load the INDX add-on (see indx_addon.py for the one-time install)
enable_addons: True

[printer INDX-Trident]
# Spool colour and remaining weight of the active Spoolman spool in the titlebar
titlebar_items: chamber, spool

#####################################################################
#   INDX panel (add-on indx_addon.py): all tools with spool colour and
#   loaded state, park, load, unload. Only in the main menu, i.e. not
#   while printing.
#####################################################################
[menu __main indx]
name: INDX
icon: toolchanger
panel: indx_tools
