# Only the moonraker.conf sections this repo depends on.
# Merge them into your existing moonraker.conf, do not replace it.

[spoolman]
server: http://<SPOOLMAN-HOST>:7912
#   Address of your Spoolman instance (NAS, Docker host, or the Pi itself)
sync_rate: 5

[timelapse]
# moonraker-timelapse plugin. Frames are taken by TIMELAPSE_TAKE_FRAME in the
# slicer's before-layer-change G-code (included in orca/Voron Trident 350 INDX.json).
# Settings: Mainsail -> Settings -> Timelapse. Videos: Mainsail -> Timelapse.

# Keeps tools/nozzle_cam.html in ~/mainsail/ across Mainsail updates.
# Add nozzle_cam.html to persistent_files of your EXISTING
# [update_manager mainsail] section (do not add a second section). Keep the
# entries already there (MainsailOS lists Mainsail's own config.json); if the
# option is missing, add it with only nozzle_cam.html:
#[update_manager mainsail]
#persistent_files:
#    nozzle_cam.html

# Optional: keep the add-ons used by the config up to date
[update_manager klipper_tmc_autotune]
type: git_repo
channel: dev
path: ~/klipper_tmc_autotune
origin: https://github.com/andrewmcgr/klipper_tmc_autotune
primary_branch: main
managed_services: klipper

[update_manager Klippain-ShakeTune]
type: git_repo
origin: https://github.com/Frix-x/klippain-shaketune.git
path: ~/klippain_shaketune
virtualenv: ~/klippy-env
requirements: requirements.txt
system_dependencies: system-dependencies.json
primary_branch: main
managed_services: klipper

[update_manager timelapse]
type: git_repo
primary_branch: main
path: ~/moonraker-timelapse
origin: https://github.com/mainsail-crew/moonraker-timelapse.git
managed_services: klipper moonraker
